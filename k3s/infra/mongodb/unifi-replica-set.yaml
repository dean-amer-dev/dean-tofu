apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mongodb-unifi
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://bedag.github.io/helm-charts/
    chart: raw
    targetRevision: 2.0.2
    helm:
      values: |
        resources:
        - apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: unifi-mongodb-password
            namespace: mongodb
          spec:
            refreshInterval: 1h
            secretStoreRef:
              name: bitwarden-secretsmanager
              kind: ClusterSecretStore
            target:
              name: unifi-mongodb-password
              creationPolicy: Owner
              deletionPolicy: Retain
            data:
            - secretKey: password
              remoteRef:
                key: unifi-mongodb-password
                conversionStrategy: Default
                decodingStrategy: None
                metadataPolicy: None
        - apiVersion: mongodbcommunity.mongodb.com/v1
          kind: MongoDBCommunity
          metadata:
            name: unifi-mongodb
            namespace: mongodb
          spec:
            type: ReplicaSet
            members: 3
            version: "8.0.32"
            security:
              authentication:
                modes: ["SCRAM"]
            users:
            - name: unifi
              db: admin
              passwordSecretRef:
                name: unifi-mongodb-password
                key: password
              scramCredentialsSecretName: unifi-scram
              roles:
              - name: dbOwner
                db: unifi
              - name: dbOwner
                db: unifi_stat
              - name: dbOwner
                db: unifi_audit
            statefulSet:
              spec:
                template:
                  spec:
                    affinity:
                      podAntiAffinity:
                        requiredDuringSchedulingIgnoredDuringExecution:
                        - labelSelector:
                            matchLabels:
                              app: unifi-mongodb-svc
                          topologyKey: kubernetes.io/hostname
                    containers:
                    - name: mongod
                      resources:
                        requests:
                          cpu: 250m
                          memory: 1Gi
                        limits:
                          memory: 1Gi
                    - name: mongodb-agent
                      resources:
                        requests:
                          cpu: 50m
                          memory: 128Mi
                        limits:
                          memory: 256Mi
                volumeClaimTemplates:
                - metadata:
                    name: data-volume
                  spec:
                    accessModes: ["ReadWriteOnce"]
                    resources:
                      requests:
                        storage: 10Gi
                - metadata:
                    name: logs-volume
                  spec:
                    accessModes: ["ReadWriteOnce"]
                    resources:
                      requests:
                        storage: 2Gi
        - apiVersion: policy/v1
          kind: PodDisruptionBudget
          metadata:
            name: unifi-mongodb
            namespace: mongodb
          spec:
            maxUnavailable: 1
            selector:
              matchLabels:
                app: unifi-mongodb-svc
  destination:
    server: https://kubernetes.default.svc
    namespace: mongodb
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
