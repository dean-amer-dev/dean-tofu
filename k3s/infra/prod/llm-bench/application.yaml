apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: llm-bench
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://bedag.github.io/helm-charts/
    chart: raw
    targetRevision: 2.0.2
    helm:
      values: |
        resources:
          - apiVersion: v1
            kind: ResourceQuota
            metadata:
              name: gpu
              namespace: llm-bench
            spec:
              hard:
                requests.nvidia.com/gpu: "1"
          - apiVersion: v1
            kind: PersistentVolumeClaim
            metadata:
              name: llm-bench-weights
              namespace: llm-bench
              annotations:
                argocd.argoproj.io/sync-options: Prune=false,Delete=false
            spec:
              accessModes:
                - ReadWriteOnce
              storageClassName: murderbot-local
              resources:
                requests:
                  storage: 500Gi
          - apiVersion: v1
            kind: ServiceAccount
            metadata:
              name: llm-bench-switch
              namespace: llm-bench
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: Role
            metadata:
              name: llm-bench-switch
              namespace: llm-bench
            rules:
              - apiGroups: ["batch"]
                resources: ["jobs"]
                verbs: ["get", "list", "watch", "create", "delete"]
              - apiGroups: [""]
                resources: ["services"]
                verbs: ["get", "list", "watch", "create", "delete"]
              - apiGroups: [""]
                resources: ["pods", "pods/log", "events"]
                verbs: ["get", "list", "watch"]
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: RoleBinding
            metadata:
              name: llm-bench-switch
              namespace: llm-bench
            roleRef:
              apiGroup: rbac.authorization.k8s.io
              kind: Role
              name: llm-bench-switch
            subjects:
              - kind: ServiceAccount
                name: llm-bench-switch
                namespace: llm-bench
          - apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              name: hf-token
              namespace: llm-bench
            spec:
              refreshInterval: 1h
              secretStoreRef:
                name: bitwarden-secretsmanager
                kind: ClusterSecretStore
              target:
                name: hf-token
                creationPolicy: Owner
                deletionPolicy: Retain
              data:
                - secretKey: token
                  remoteRef:
                    key: hugging-face-read-only
                    conversionStrategy: Default
                    decodingStrategy: None
                    metadataPolicy: None
          - apiVersion: v1
            kind: ConfigMap
            metadata:
              name: llm-bench-stage-script
              namespace: llm-bench
            data:
              stage.py: |
                __STAGE_PY__
          - apiVersion: v1
            kind: ConfigMap
            metadata:
              name: llm-bench-runners
              namespace: llm-bench
            data:
              runners.yaml: |
                # One entry per runner. Only murderbot is implemented.
                runners:
                  murderbot:
                    kind: k8s-gpu
                    namespace: llm-bench
                    node: murderbot
                    gpuResource: nvidia.com/gpu
                    runtimeClassName: nvidia
                    priorityClassName: llmkube-high
                    weightsPvc: llm-bench-weights
                    defaultModel: {namespace: llm, inferenceService: qwen38-27b-uncensored}
                    vramBytes: 25655508992
                    vramReserveBytes: 1610612736
                    evictAboveGiB: 300
                    lease: {defaultMinutes: 30, maxMinutes: 120}
                    startup: {defaultMinutes: 10, maxMinutes: 20}
                    finishedJobTtlSeconds: 300
                    serve: {cpu: "4", memory: 28Gi}
                    stage:
                      image: docker.io/library/python@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
                      scriptConfigMap: llm-bench-stage-script
                      hfTokenSecret: hf-token
                      cpu: "2"
                      memory: 4Gi
                      deadlineMinutes: 240
                    engines:
                      ninfer:
                        image: ghcr.io/dean-amer-dev/murderbot-llm@sha256:6ee1e235b1361f2b00eec09f72f1dd5157f01c917cb36ad35c50238f4ab2d222
                        mode: args
                        fixedArgs: ["--host", "0.0.0.0", "--port", "8080"]
                        health: {path: /health, port: 8080}
                        supportedContainerVersions: [2]
                      llamacpp:
                        image: ghcr.io/ggml-org/llama.cpp@sha256:6869e4456217802e5372774be236a9aa93666cfb7f033b7d39cd58b178af6489
                        mode: command
                        command: ["/app/llama-server"]
                        fixedArgs: ["--host", "0.0.0.0", "--port", "8080", "-ngl", "999"]
                        health: {path: /health, port: 8080}
                      ollama:
                        image: docker.io/ollama/ollama@sha256:b86366bb528bbf7f1424435d165028497a5b69bf6ddb4fa5a87102e2b79f44fb
                        mode: env
                        env: {OLLAMA_HOST: "0.0.0.0:8080", OLLAMA_MODELS: /weights/ollama, OLLAMA_KEEP_ALIVE: "-1"}
                        health: {path: /, port: 8080}
          - apiVersion: batch/v1
            kind: Job
            metadata:
              name: prepull-ninfer
              namespace: llm-bench
            spec:
              backoffLimit: 4
              template:
                spec:
                  restartPolicy: Never
                  runtimeClassName: nvidia
                  nodeSelector:
                    kubernetes.io/hostname: murderbot
                  tolerations:
                    - key: gpu-worker
                      operator: Equal
                      value: "true"
                      effect: NoSchedule
                  containers:
                    - name: smoke
                      image: ghcr.io/dean-amer-dev/murderbot-llm@sha256:6ee1e235b1361f2b00eec09f72f1dd5157f01c917cb36ad35c50238f4ab2d222
                      imagePullPolicy: IfNotPresent
                      command: ["sh", "-c", "nvidia-smi -L; ls /app /usr/local/bin 2>&1 | head -40"]
                      env:
                        - name: NVIDIA_VISIBLE_DEVICES
                          value: all
                        - name: NVIDIA_DRIVER_CAPABILITIES
                          value: compute,utility
          - apiVersion: batch/v1
            kind: Job
            metadata:
              name: prepull-llamacpp
              namespace: llm-bench
            spec:
              backoffLimit: 4
              template:
                spec:
                  restartPolicy: Never
                  runtimeClassName: nvidia
                  nodeSelector:
                    kubernetes.io/hostname: murderbot
                  tolerations:
                    - key: gpu-worker
                      operator: Equal
                      value: "true"
                      effect: NoSchedule
                  containers:
                    - name: smoke
                      image: ghcr.io/ggml-org/llama.cpp@sha256:6869e4456217802e5372774be236a9aa93666cfb7f033b7d39cd58b178af6489
                      imagePullPolicy: IfNotPresent
                      command: ["sh", "-c", "nvidia-smi -L; /app/llama-server --version 2>&1 | tail -5"]
                      env:
                        - name: NVIDIA_VISIBLE_DEVICES
                          value: all
                        - name: NVIDIA_DRIVER_CAPABILITIES
                          value: compute,utility
          - apiVersion: batch/v1
            kind: Job
            metadata:
              name: prepull-ollama
              namespace: llm-bench
            spec:
              backoffLimit: 4
              template:
                spec:
                  restartPolicy: Never
                  runtimeClassName: nvidia
                  nodeSelector:
                    kubernetes.io/hostname: murderbot
                  tolerations:
                    - key: gpu-worker
                      operator: Equal
                      value: "true"
                      effect: NoSchedule
                  containers:
                    - name: smoke
                      image: docker.io/ollama/ollama@sha256:b86366bb528bbf7f1424435d165028497a5b69bf6ddb4fa5a87102e2b79f44fb
                      imagePullPolicy: IfNotPresent
                      command: ["sh", "-c", "nvidia-smi -L; ollama --version"]
                      env:
                        - name: NVIDIA_VISIBLE_DEVICES
                          value: all
                        - name: NVIDIA_DRIVER_CAPABILITIES
                          value: compute,utility
  destination:
    server: https://kubernetes.default.svc
    namespace: llm-bench
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
