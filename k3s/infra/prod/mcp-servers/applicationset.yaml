                      decodingStrategy: None
                      metadataPolicy: None
                  - secretKey: GITHUB_APP_PRIVATE_KEY
                    remoteRef:
                      key: github-amerenda-coder-private-key
                      conversionStrategy: Default
                      decodingStrategy: None
                      metadataPolicy: None
                  - secretKey: GITHUB_APP_INSTALLATION_ID
                    remoteRef:
                      key: github-amerenda-coder-installation-id
                      conversionStrategy: Default
                      decodingStrategy: None
                      metadataPolicy: None
              - apiVersion: v1
                kind: Service
