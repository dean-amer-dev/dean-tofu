apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: mcp-servers
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: obsidian-mcp
            namespace: mcp
            valuesYaml: |
              resources:
                - apiVersion: external-secrets.io/v1
                  kind: ExternalSecret
                  metadata:
                    name: obsidian-mcp-secrets
                    namespace: mcp
                  spec:
                    refreshInterval: 1h
                    secretStoreRef:
                      name: bitwarden-secretsmanager
                      kind: ClusterSecretStore
                    target:
                      name: obsidian-mcp-secrets
                      creationPolicy: Owner
                      deletionPolicy: Retain
                    data:
                      - secretKey: couchdb_password
                        remoteRef:
                          key: couchdb-k3s-mcp-password
                          conversionStrategy: Default
                          decodingStrategy: None
                          metadataPolicy: None
                      - secretKey: e2ee_passphrase
                        remoteRef:
                          key: obsidian-livesync-e2e-passphrase
                          conversionStrategy: Default
                          decodingStrategy: None
                          metadataPolicy: None
                - apiVersion: v1
                  kind: Service
                  metadata:
                    name: obsidian-mcp-server
                    namespace: mcp
                    labels:
                      mcp.amer.dev/expose: "true"
                    annotations:
                      agentgateway.dev/mcp-target-name: obsidian-mcp
                  spec:
                    selector:
                      app: obsidian-mcp-server
                    ports:
                      - port: 8787
                        targetPort: 8787
                        appProtocol: agentgateway.dev/mcp
                        protocol: TCP
                - apiVersion: apps/v1
                  kind: Deployment
                  metadata:
                    name: obsidian-mcp-server
                    namespace: mcp
                  spec:
                    replicas: 1
                    selector:
                      matchLabels:
                        app: obsidian-mcp-server
                    template:
                      metadata:
                        labels:
                          app: obsidian-mcp-server
                      spec:
                        containers:
                          - name: server
                            image: ghcr.io/es617/obsidian-sync-mcp:latest
                            imagePullPolicy: Always
                            ports:
                              - containerPort: 8787
                            env:
                              - name: COUCHDB_URL
                                value: 'https://couchdb.amer.dev'
                              - name: COUCHDB_USER
                                value: 'mcp'
                              - name: COUCHDB_DATABASE
                                value: 'obsidian-dean'
                              - name: COUCHDB_OBFUSCATE_PROPERTIES
                                value: 'false'
                              - name: VAULT_NAME
                                value: 'Dean'
                              - name: PORT
                                value: '8787'
                              - name: MCP_ALLOWED_HOSTS
                                value: 'obsidian-mcp-server,obsidian-mcp-server.mcp,obsidian-mcp-server.mcp.svc,obsidian-mcp-server.mcp.svc.cluster.local,mcp-obsidian.amer.dev'
                              - name: COUCHDB_PASSWORD
                                valueFrom:
                                  secretKeyRef:
                                    name: obsidian-mcp-secrets
                                    key: couchdb_password
                              - name: COUCHDB_PASSPHRASE
                                valueFrom:
                                  secretKeyRef:
                                    name: obsidian-mcp-secrets
                                    key: e2ee_passphrase
                            readinessProbe:
                              tcpSocket:
                                port: 8787
                              initialDelaySeconds: 5
                              periodSeconds: 10
                            resources:
                              requests:
                                cpu: 50m
                                memory: 128Mi
                              limits:
                                cpu: 300m
                                memory: 256Mi
                - apiVersion: networking.k8s.io/v1
                  kind: Ingress
                  metadata:
                    name: mcp-obsidian-ingress
                    namespace: mcp
                    annotations:
                      cert-manager.io/cluster-issuer: letsencrypt-prod
                      external-dns.alpha.kubernetes.io/hostname: mcp-obsidian.amer.dev
                      external-dns.alpha.kubernetes.io/ttl: "300"
                  spec:
                    tls:
                      - hosts:
                          - mcp-obsidian.amer.dev
                        secretName: mcp-obsidian-amer-dev-tls
                    rules:
                      - host: mcp-obsidian.amer.dev
                        http:
                          paths:
                            - path: /
                              pathType: Prefix
                              backend:
                                service:
                                  name: obsidian-mcp-server
                                  port:
                                    number: 8787

          - name: bws-mcp
            namespace: mcp
            valuesYaml: |
              resources:
                - apiVersion: external-secrets.io/v1
                  kind: ExternalSecret
                  metadata:
                    name: bws-mcp-token
                    namespace: mcp
                  spec:
                    refreshInterval: 1h
                    secretStoreRef:
                      name: bitwarden-secretsmanager
                      kind: ClusterSecretStore
                    target:
                      name: bws-mcp-token
                      creationPolicy: Owner
                      deletionPolicy: Retain
                    data:
                      - secretKey: token
                        remoteRef:
                          key: infra-mcp-bws-token
                          conversionStrategy: Default
                          decodingStrategy: None
                          metadataPolicy: None
                - apiVersion: v1
                  kind: Service
                  metadata:
                    name: bws-mcp-server
                    namespace: mcp
                    labels:
                      mcp.amer.dev/expose: "true"
                    annotations:
                      agentgateway.dev/mcp-target-name: bws-mcp
                  spec:
                    selector:
                      app: bws-mcp-server
                    ports:
                      - name: http
                        port: 8000
                        targetPort: 8000
                        appProtocol: agentgateway.dev/mcp
                - apiVersion: apps/v1
                  kind: Deployment
                  metadata:
                    name: bws-mcp-server
                    namespace: mcp
                    annotations:
                      reloader.stakater.com/auto: "true"
                  spec:
                    replicas: 1
                    selector:
                      matchLabels:
                        app: bws-mcp-server
                    strategy:
                      type: RollingUpdate
                      rollingUpdate:
                        maxUnavailable: 0
                        maxSurge: 1
                    template:
                      metadata:
                        labels:
                          app: bws-mcp-server
                      spec:
                        containers:
                          - name: server
                            image: amerenda/bws-mcp:sha-a38bd82
                            imagePullPolicy: Always
                            ports:
                              - containerPort: 8000
                            env:
                              - name: BWS_ACCESS_TOKEN
                                valueFrom:
                                  secretKeyRef:
                                    name: bws-mcp-token
                                    key: token
                              - name: BWS_PROJECT_ID
                                value: "6353f589-39c0-45f2-9e9c-b36f00e0c282"
                            readinessProbe:
                              httpGet:
                                path: /health
                                port: 8000
                              initialDelaySeconds: 5
                              periodSeconds: 10
                            livenessProbe:
                              httpGet:
                                path: /health
                                port: 8000
                              initialDelaySeconds: 10
                              periodSeconds: 30
                            resources:
                              requests:
                                cpu: 50m
                                memory: 64Mi
                              limits:
                                cpu: 200m
                                memory: 128Mi

          - name: infra-mcp
            namespace: mcp
            valuesYaml: |
              resources:
                - apiVersion: external-secrets.io/v1
                  kind: ExternalSecret
                  metadata:
                    name: infra-mcp-secrets
                    namespace: mcp
                  spec:
                    refreshInterval: 1h
                    secretStoreRef:
                      name: bitwarden-secretsmanager
                      kind: ClusterSecretStore
                    target:
                      name: infra-mcp-secrets
                      creationPolicy: Owner
                      deletionPolicy: Retain
                    data:
                      - secretKey: bws-access-token
                        remoteRef:
                          key: infra-mcp-bws-token
                          conversionStrategy: Default
                          decodingStrategy: None
                          metadataPolicy: None
                      - secretKey: coder-app-id
                        remoteRef:
                          key: github-amerenda-coder-app-id
                          conversionStrategy: Default
                          decodingStrategy: None
                          metadataPolicy: None
                      - secretKey: coder-installation-id
                        remoteRef:
                          key: github-amerenda-coder-installation-id
                          conversionStrategy: Default
                          decodingStrategy: None
                          metadataPolicy: None
                      - secretKey: coder-private-key
                        remoteRef:
                          key: github-amerenda-coder-private-key
                          conversionStrategy: Default
                          decodingStrategy: None
                          metadataPolicy: None
                - apiVersion: v1
                  kind: Service
                  metadata:
                    name: infra-mcp-server
                    namespace: mcp
                    labels:
                      mcp.amer.dev/expose: "true"
                    annotations:
                      agentgateway.dev/mcp-target-name: infra
                  spec:
                    selector:
                      app: infra-mcp-server
                    ports:
                      - name: http
                        port: 8000
                        targetPort: 8000
                        appProtocol: agentgateway.dev/mcp
                - apiVersion: v1
                  kind: ServiceAccount
                  metadata:
                    name: infra-mcp-sa
                    namespace: mcp
                - apiVersion: rbac.authorization.k8s.io/v1
                  kind: ClusterRole
                  metadata:
                    name: infra-mcp-observer
                  rules:
                    - apiGroups: ["argoproj.io"]
                      resources: ["applications"]
                      verbs: ["get", "list"]
                    - apiGroups: [""]
                      resources: ["pods"]
                      verbs: ["get", "list"]
                    - apiGroups: ["apps"]
                      resources: ["deployments"]
                      verbs: ["get", "list"]
                - apiVersion: rbac.authorization.k8s.io/v1
                  kind: ClusterRoleBinding
                  metadata:
                    name: infra-mcp-observer
                  subjects:
                    - kind: ServiceAccount
                      name: infra-mcp-sa
                      namespace: mcp
                  roleRef:
                    kind: ClusterRole
                    name: infra-mcp-observer
                    apiGroup: rbac.authorization.k8s.io
                - apiVersion: rbac.authorization.k8s.io/v1
                  kind: Role
                  metadata:
                    name: tofu-state
                    namespace: mcp
                  rules:
                    - apiGroups: [""]
                      resources: ["secrets"]
                      verbs: ["create", "get", "list", "update", "patch", "delete"]
                    - apiGroups: ["coordination.k8s.io"]
                      resources: ["leases"]
                      verbs: ["create", "get", "list", "update", "patch", "delete"]
                - apiVersion: rbac.authorization.k8s.io/v1
                  kind: RoleBinding
                  metadata:
                    name: tofu-state
                    namespace: mcp
                  subjects:
                    - kind: ServiceAccount
                      name: infra-mcp-sa
                      namespace: mcp
                  roleRef:
                    kind: Role
                    name: tofu-state
                    apiGroup: rbac.authorization.k8s.io
                - apiVersion: apps/v1
                  kind: Deployment
                  metadata:
                    name: infra-mcp-server
                    namespace: mcp
                  spec:
                    replicas: 1
                    selector:
                      matchLabels:
                        app: infra-mcp-server
                    strategy:
                      type: RollingUpdate
                      rollingUpdate:
                        maxUnavailable: 0
                        maxSurge: 1
                    template:
                      metadata:
                        annotations:
                          reloader.stakater.com/auto: "true"
                        labels:
                          app: infra-mcp-server
                      spec:
                        serviceAccountName: infra-mcp-sa
                        containers:
                          - name: server
                            image: amerenda/infra-mcp:sha-a38bd82
                            imagePullPolicy: Always
                            ports:
                              - containerPort: 8000
                            env:
                              - name: BWS_ACCESS_TOKEN
                                valueFrom:
                                  secretKeyRef:
                                    name: infra-mcp-secrets
                                    key: bws-access-token
                              - name: CODER_APP_ID
                                valueFrom:
                                  secretKeyRef:
                                    name: infra-mcp-secrets
                                    key: coder-app-id
                              - name: CODER_INSTALLATION_ID
                                valueFrom:
                                  secretKeyRef:
                                    name: infra-mcp-secrets
                                    key: coder-installation-id
                              - name: CODER_APP_PRIVATE_KEY
                                valueFrom:
                                  secretKeyRef:
                                    name: infra-mcp-secrets
                                    key: coder-private-key
                              - name: CLONE_REPOS
                                value: "true"
                            readinessProbe:
                              httpGet:
                                path: /health
                                port: 8000
                              initialDelaySeconds: 5
                              periodSeconds: 10
                            livenessProbe:
                              httpGet:
                                path: /health
                                port: 8000
                              initialDelaySeconds: 10
                              periodSeconds: 30
                            resources:
                              requests:
                                cpu: 100m
                                memory: 256Mi
                              limits:
                                cpu: 500m
                                memory: 512Mi
                - apiVersion: networking.k8s.io/v1
                  kind: Ingress
                  metadata:
                    name: infra-mcp-ingress
                    namespace: mcp
                    annotations:
                      cert-manager.io/cluster-issuer: letsencrypt-prod
                      external-dns.alpha.kubernetes.io/hostname: infra-mcp.amer.dev
                      external-dns.alpha.kubernetes.io/ttl: "300"
                  spec:
                    tls:
                      - hosts:
                          - infra-mcp.amer.dev
                        secretName: infra-mcp-amer-dev-tls
                    rules:
                      - host: infra-mcp.amer.dev
                        http:
                          paths:
                            - path: /
                              pathType: Prefix
                              backend:
                                service:
                                  name: infra-mcp-server
                                  port:
                                    number: 8000

          - name: github-mcp
            namespace: mcp
            valuesYaml: |
              resources:
              - apiVersion: external-secrets.io/v1
                kind: ExternalSecret
                metadata:
                  name: github-mcp-secrets
                  namespace: mcp
                spec:
                  refreshInterval: 1h
