                    name: grafana-mcp-secrets
                    creationPolicy: Owner
                    deletionPolicy: Retain
                  data:
                  - secretKey: grafana_api_key
                    remoteRef:
                      key: grafana-sa-mcp-user-token
                      conversionStrategy: Default
                      decodingStrategy: None
                      metadataPolicy: None
              - apiVersion: v1
                kind: Service
                metadata:
                  name: grafana-mcp-server
                  namespace: mcp
                  labels:
                    mcp.amer.dev/expose: "true"
                  annotations:
                    agentgateway.dev/mcp-target-name: grafana-mcp
                spec:
                  selector:
