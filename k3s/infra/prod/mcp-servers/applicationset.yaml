              - apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRoleBinding
                metadata:
                  name: kubernetes-mcp-extra-view-binding
                roleRef:
                  apiGroup: rbac.authorization.k8s.io
                  kind: ClusterRole
                  name: kubernetes-mcp-extra-view
                subjects:
                - kind: ServiceAccount
                  name: kubernetes-mcp-sa
                  namespace: mcp
              - apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRoleBinding
                metadata:
                  name: kubernetes-mcp-view-binding
                roleRef:
                  apiGroup: rbac.authorization.k8s.io
                  kind: ClusterRole
                  name: view
                subjects:
                - kind: ServiceAccount
                  name: kubernetes-mcp-sa
                  namespace: mcp
              - apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: kubernetes-mcp-nginx-proxy
                  namespace: mcp
                data:
                  default.conf: "server {\n  listen 8080;\n  location / {\n    # Rewrite Host header to \"localhost\" so the MCP server accepts the request.\n    # Without this, the FQDN from cluster DNS causes host validation failure.\n    proxy_pass http://127.0.0.1:3000;\n    proxy_set_header Host localhost;\n\n    # HTTP/1.1 + empty Connection header = keep-alive to upstream\n    proxy_http_version 1.1;\n    proxy_set_header Connection \"\";\n\n    # Accommodate long-running kubernetes tool calls (list/watch, logs)\n    proxy_read_timeout 300s;\n  }\n}\n"
              - apiVersion: v1
                kind: Service
                metadata:
                  name: kubernetes-mcp-server
                  namespace: mcp
                  labels:
                    mcp.amer.dev/expose: "true"
                  annotations:
                    agentgateway.dev/mcp-target-name: kubernetes-mcp
                spec:
                  selector:
                    app: kubernetes-mcp-server
                  ports:
                  - name: http
                    port: 8000
                    targetPort: 8080
                    appProtocol: agentgateway.dev/mcp
              - apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: kubernetes-mcp-server
                  namespace: mcp
                  annotations:
                    reloader.stakater.com/auto: 'true'
                spec:
                  replicas: 1
                  selector:
                    matchLabels:
                      app: kubernetes-mcp-server
                  strategy:
                    type: RollingUpdate
                    rollingUpdate:
                      maxUnavailable: 0
                      maxSurge: 1
                  template:
                    metadata:
                      labels:
                        app: kubernetes-mcp-server
                    spec:
                      serviceAccountName: kubernetes-mcp-sa
                      containers:
                      - name: server
                        image: flux159/mcp-server-kubernetes@sha256:7aa82daa1f10f4305dd8b47fc0351250c342066edc52a68254bb50a84ec067a1
                        imagePullPolicy: IfNotPresent
                        ports:
                        - containerPort: 3000
                        env:
                        - name: HOST
                          value: 0.0.0.0
                        - name: ENABLE_UNSAFE_STREAMABLE_HTTP_TRANSPORT
                          value: 'true'
                        - name: ALLOW_ONLY_READONLY_TOOLS
                          value: 'true'
                        readinessProbe:
                          exec:
                            command:
                            - sh
                            - -c
                            - curl -s -o /dev/null -m 5 http://localhost:3000/mcp
                          initialDelaySeconds: 5
                          periodSeconds: 10
                          timeoutSeconds: 8
                          failureThreshold: 3
                        livenessProbe:
                          exec:
                            command:
                            - sh
                            - -c
                            - curl -s -o /dev/null -m 5 http://localhost:3000/mcp
                          initialDelaySeconds: 15
                          periodSeconds: 20
                          timeoutSeconds: 8
                          failureThreshold: 6
                        resources:
                          requests:
                            cpu: 50m
                            memory: 96Mi
                          limits:
                            cpu: 300m
                            memory: 256Mi
                      - name: host-proxy
                        image: nginx:alpine
                        ports:
                        - containerPort: 8080
                        readinessProbe:
                          tcpSocket:
                            port: 8080
                          initialDelaySeconds: 2
                          periodSeconds: 5
                        volumeMounts:
                        - name: nginx-conf
                          mountPath: /etc/nginx/conf.d
                          readOnly: true
                        resources:
                          requests:
                            cpu: 5m
                            memory: 16Mi
                          limits:
                            cpu: 50m
                            memory: 32Mi
                      volumes:
                      - name: nginx-conf
                        configMap:
                          name: kubernetes-mcp-nginx-proxy

          - name: mcp-searxng
            namespace: mcp
            valuesYaml: |
              resources:
              - apiVersion: v1
                kind: Service
                metadata:
                  name: mcp-searxng-server
                  namespace: mcp
                  labels:
                    mcp.amer.dev/expose: "true"
                  annotations:
                    agentgateway.dev/mcp-target-name: searxng
                spec:
                  selector:
                    app: mcp-searxng-server
                  ports:
                  - name: http
                    port: 8000
                    targetPort: 8000
                    appProtocol: agentgateway.dev/mcp
              - apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: mcp-searxng-server
                  namespace: mcp
                spec:
                  replicas: 1
                  selector:
                    matchLabels:
                      app: mcp-searxng-server
                  strategy:
                    type: RollingUpdate
                    rollingUpdate:
                      maxUnavailable: 0
                      maxSurge: 1
                  template:
                    metadata:
                      labels:
                        app: mcp-searxng-server
                    spec:
                      containers:
                      - name: server
                        image: ghcr.io/dean-amer-dev/mcp-searxng:sha-8d21293c474519ab196e03a422b4de44462e05da@sha256:54c5f75e627bdd812d5e3f4823af3b2101bde86db55bc01b18de5c67bc641495
                        imagePullPolicy: Always
                        ports:
                        - containerPort: 8000
                        env:
                        - name: SEARXNG_URL
                          value: http://searxng.searxng.svc.cluster.local:8080
                        - name: MAX_RESULTS
                          value: '5'
                        - name: MAX_CONTENT_CHARS
                          value: '600'
                        - name: MAX_URL_CONTENT_CHARS
                          value: '4000'
                        - name: EMBED_URL
                          value: http://modernbert-embed-mini.llm.svc.cluster.local:8080/v1/embeddings
                        - name: EMBED_MODEL
                          value: nomicai-modernbert-embed-base-8bit
                        readinessProbe:
                          httpGet:
                            path: /health
                            port: 8000
                          initialDelaySeconds: 5
                          periodSeconds: 10
                        livenessProbe:
                          httpGet:
                            path: /health
                            port: 8000
                          initialDelaySeconds: 10
                          periodSeconds: 30
                        resources:
                          requests:
                            cpu: 10m
                            memory: 128Mi
                          limits:
                            cpu: 200m
                            memory: 384Mi
              - apiVersion: networking.k8s.io/v1
                kind: Ingress
                metadata:
                  name: mcp-searxng-ingress
                  namespace: mcp
                  annotations:
                    cert-manager.io/cluster-issuer: letsencrypt-prod
                    external-dns.alpha.kubernetes.io/hostname: mcp-searxng.amer.dev
                    external-dns.alpha.kubernetes.io/ttl: '300'
                spec:
                  tls:
                  - hosts:
                    - mcp-searxng.amer.dev
                    secretName: mcp-searxng-amer-dev-tls
                  rules:
                  - host: mcp-searxng.amer.dev
                    http:
                      paths:
                      - path: /
                        pathType: Prefix
                        backend:
                          service:
                            name: mcp-searxng-server
                            port:
                              number: 8000

          - name: secure-search-mcp
            namespace: mcp
            valuesYaml: |
              resources:
              - apiVersion: external-secrets.io/v1
                kind: ExternalSecret
                metadata:
                  name: secure-search-mcp-secrets
                  namespace: mcp
                spec:
                  refreshInterval: 1h
                  secretStoreRef:
                    name: bitwarden-secretsmanager
                    kind: ClusterSecretStore
                  target:
                    name: secure-search-mcp-secrets
                    creationPolicy: Owner
                    deletionPolicy: Retain
                  data:
                  - secretKey: NORDVPN_ACCESS_TOKEN
                    remoteRef:
                      key: nordvpn-access-token
                      conversionStrategy: Default
                      decodingStrategy: None
                      metadataPolicy: None
                  - secretKey: NORDVPN_WIREGUARD_PRIVATE_KEY
                    remoteRef:
                      key: nordvpn-wireguard-private-key
                      conversionStrategy: Default
                      decodingStrategy: None
                      metadataPolicy: None
              - apiVersion: v1
                kind: Service
                metadata:
                  name: secure-search-mcp-server
                  namespace: mcp
                  labels:
                    mcp.amer.dev/expose: "true"
                  annotations:
                    agentgateway.dev/mcp-target-name: secure-search
                spec:
                  selector:
                    app: secure-search-mcp-server
                  ports:
                  - name: http
                    port: 8000
                    targetPort: 8000
                    appProtocol: agentgateway.dev/mcp
              - apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: secure-search-mcp-server
                  namespace: mcp
                  annotations:
                    reloader.stakater.com/auto: 'true'
                spec:
                  replicas: 1
                  selector:
                    matchLabels:
                      app: secure-search-mcp-server
                  strategy:
                    type: RollingUpdate
                    rollingUpdate:
                      maxUnavailable: 0
                      maxSurge: 1
                  template:
                    metadata:
                      labels:
                        app: secure-search-mcp-server
                    spec:
                      dnsPolicy: "None"
                      dnsConfig:
                        nameservers:
                          - 127.0.0.1
                        options:
                          - name: ndots
                            value: "1"
                      containers:
                      - name: gluetun
                        image: ghcr.io/qdm12/gluetun:latest
                        imagePullPolicy: Always
                        securityContext:
                          privileged: true
                        env:
                        - name: VPN_SERVICE_PROVIDER
                          value: nordvpn
                        - name: VPN_TYPE
                          value: wireguard
                        - name: NORDVPN_ACCESS_TOKEN
                          valueFrom:
                            secretKeyRef:
                              name: secure-search-mcp-secrets
                              key: NORDVPN_ACCESS_TOKEN
                        - name: WIREGUARD_PRIVATE_KEY
                          valueFrom:
                            secretKeyRef:
                              name: secure-search-mcp-secrets
                              key: NORDVPN_WIREGUARD_PRIVATE_KEY
                        - name: SERVER_COUNTRIES
                          value: Switzerland
                        - name: HTTP_CONTROL_SERVER_ADDRESS
                          value: :8001
                        - name: FIREWALL_OUTBOUND_SUBNETS
                          value: 10.44.0.0/16,10.45.0.0/16
                        - name: FIREWALL_INPUT_PORTS
                          value: "8000,8001"
                        - name: BLOCK_MALICIOUS
                          value: "off"
                        - name: TZ
                          value: UTC
                        - name: LOG_LEVEL
                          value: info
                        ports:
                        - containerPort: 8001
                          name: vpn-ctrl
                        livenessProbe:
                          tcpSocket:
                            port: 8001
                          initialDelaySeconds: 15
                          periodSeconds: 30
                          timeoutSeconds: 5
                          failureThreshold: 3
                        resources:
                          requests:
                            cpu: 50m
                            memory: 64Mi
                          limits:
                            cpu: 200m
                            memory: 128Mi
                      - name: server
                        image: amerenda/secure-search-mcp:sha-c323698
                        imagePullPolicy: Always
                        ports:
                        - containerPort: 8000
                          name: mcp
                        env:
                        - name: VPN_INTERFACE
                          value: tun0
                        - name: SEARXNG_URL
                          value: http://10.45.49.242:8080
                        - name: MAX_RESULTS
                          value: '5'
                        - name: MAX_CONTENT_CHARS
                          value: '600'
                        - name: MAX_URL_CONTENT_CHARS
                          value: '4000'
                        readinessProbe:
                          httpGet:
                            path: /health
                            port: 8000
                          initialDelaySeconds: 10
                          periodSeconds: 10
                          timeoutSeconds: 5
                        livenessProbe:
                          httpGet:
                            path: /health
                            port: 8000
                          initialDelaySeconds: 15
                          periodSeconds: 30
                          timeoutSeconds: 5
                        resources:
                          requests:
                            cpu: 10m
                            memory: 128Mi
                          limits:
                            cpu: 200m
                            memory: 384Mi
              - apiVersion: networking.k8s.io/v1
                kind: Ingress
                metadata:
                  name: secure-search-mcp-ingress
                  namespace: mcp
                  annotations:
                    cert-manager.io/cluster-issuer: letsencrypt-prod
                    external-dns.alpha.kubernetes.io/hostname: secure-search-mcp.amer.dev
                    external-dns.alpha.kubernetes.io/ttl: '300'
                spec:
                  tls:
                  - hosts:
                    - secure-search-mcp.amer.dev
                    secretName: secure-search-mcp-amer-dev-tls
                  rules:
                  - host: secure-search-mcp.amer.dev
                    http:
                      paths:
                      - path: /
                        pathType: Prefix
                        backend:
                          service:
                            name: secure-search-mcp-server
                            port:
                              number: 8000

  template:
    metadata:
      name: "mcp-{{name}}"
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: https://bedag.github.io/helm-charts/
        chart: raw
        targetRevision: 2.0.2
        helm:
          values: "{{valuesYaml}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
