                    reloader.stakater.com/auto: 'true'
                spec:
                  replicas: 1
                  selector:
                    matchLabels:
                      app: komodo-mcp-server
                  template:
                    metadata:
                      labels:
                        app: komodo-mcp-server
                    spec:
                      containers:
                      - name: server
                        image: amerenda/komodo-mcp:sha-e76f0be
                        imagePullPolicy: Always
                        ports:
                        - containerPort: 8000
                        env:
                        - name: KOMODO_BASE
                          value: https://komodo.amer.dev
                        - name: KOMODO_API_KEY
                          valueFrom:
                            secretKeyRef:
                              name: komodo-mcp-secrets
                              key: komodo_api_key
                        - name: KOMODO_API_SECRET
                          valueFrom:
                            secretKeyRef:
                              name: komodo-mcp-secrets
                              key: komodo_api_secret
                        readinessProbe:
                          tcpSocket:
                            port: 8000
                          initialDelaySeconds: 5
                          periodSeconds: 10
                        resources:
                          requests:
                            cpu: 10m
                            memory: 64Mi
                          limits:
                            cpu: 100m
                            memory: 128Mi

          - name: kubernetes-mcp
            namespace: mcp
            valuesYaml: |
              resources:
              - apiVersion: v1
                kind: ServiceAccount
                metadata:
                  name: kubernetes-mcp-sa
                  namespace: mcp
              - apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRole
                metadata:
                  name: kubernetes-mcp-extra-view
                rules:
                - apiGroups:
                  - ''
                  resources:
                  - nodes
                  - persistentvolumes
                  verbs:
                  - get
                  - list
                  - watch
                - apiGroups:
                  - argoproj.io
                  resources:
