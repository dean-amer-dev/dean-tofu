              - apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: github-mcp-server
                  namespace: mcp
                spec:
                  replicas: 1
                  selector:
                    matchLabels:
                      app: github-mcp-server
                  strategy:
                    type: RollingUpdate
                    rollingUpdate:
                      maxUnavailable: 0
                      maxSurge: 1
                  template:
                    metadata:
                      annotations:
                        reloader.stakater.com/auto: 'true'
                      labels:
                        app: github-mcp-server
                    spec:
                      containers:
                      - name: server
                        image: amerenda/github-mcp:sha-a38bd82
                        imagePullPolicy: Always
                        ports:
                        - containerPort: 8000
                        envFrom:
                        - secretRef:
                            name: github-mcp-secrets
                        readinessProbe:
                          httpGet:
                            path: /health
                            port: 8000
                          initialDelaySeconds: 5
                          periodSeconds: 10
                        livenessProbe:
                          httpGet:
                            path: /health
                            port: 8000
                          initialDelaySeconds: 10
                          periodSeconds: 30
                        resources:
                          requests:
                            cpu: 10m
                            memory: 64Mi
                          limits:
                            cpu: 200m
                            memory: 128Mi
              - apiVersion: networking.k8s.io/v1
                kind: Ingress
                metadata:
                  name: github-mcp-ingress
                  namespace: mcp
                  annotations:
                    cert-manager.io/cluster-issuer: letsencrypt-prod
                    external-dns.alpha.kubernetes.io/hostname: github-mcp.amer.dev
                    external-dns.alpha.kubernetes.io/ttl: '300'
                spec:
                  tls:
                  - hosts:
                    - github-mcp.amer.dev
                    secretName: github-mcp-amer-dev-tls
                  rules:
                  - host: github-mcp.amer.dev
                    http:
                      paths:
                      - path: /
                        pathType: Prefix
                        backend:
                          service:
                            name: github-mcp-server
                            port:
                              number: 8000

          - name: praetor-mcp
            namespace: mcp
            valuesYaml: |
              resources:
              - apiVersion: external-secrets.io/v1
                kind: ExternalSecret
                metadata:
                  name: praetor-mcp-secrets
                  namespace: mcp
                spec:
                  refreshInterval: 1h
                  secretStoreRef:
                    name: bitwarden-secretsmanager
                    kind: ClusterSecretStore
                  target:
                    name: praetor-mcp-secrets
                    creationPolicy: Owner
                    deletionPolicy: Retain
                  data:
                  - secretKey: PRAETOR_API_KEY
                    remoteRef:
                      key: praetor-api-key
                      conversionStrategy: Default
                      decodingStrategy: None
                      metadataPolicy: None
              - apiVersion: v1
                kind: Service
                metadata:
                  name: praetor-mcp-server
                  namespace: mcp
                  labels:
                    mcp.amer.dev/expose: "true"
                  annotations:
                    agentgateway.dev/mcp-target-name: praetor
                spec:
                  selector:
                    app: praetor-mcp-server
                  ports:
