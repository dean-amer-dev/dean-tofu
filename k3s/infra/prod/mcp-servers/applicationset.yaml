                      labels:
                        app: grafana-mcp-server
                    spec:
                      containers:
                      - name: server
                        image: grafana/mcp-grafana:latest
                        imagePullPolicy: Always
                        args:
                        - -t
                        - streamable-http
                        - -address
                        - 0.0.0.0:8000
                        - -allowed-hosts
                        - '*'
                        ports:
                        - containerPort: 8000
                        env:
                        - name: GRAFANA_URL
                          value: https://grafana.amer.dev
                        - name: GRAFANA_API_KEY
                          valueFrom:
                            secretKeyRef:
                              name: grafana-mcp-secrets
                              key: grafana_api_key
                        readinessProbe:
