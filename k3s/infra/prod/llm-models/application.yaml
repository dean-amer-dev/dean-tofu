apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: llm-models
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://bedag.github.io/helm-charts/
    chart: raw
    targetRevision: 2.0.2
    helm:
      values: |
        resources:
          - apiVersion: v1
            kind: PersistentVolumeClaim
            metadata:
              name: llm-models
              namespace: llm
              annotations:
                argocd.argoproj.io/sync-options: Prune=false,Delete=false
            spec:
              accessModes:
                - ReadWriteOnce
              storageClassName: murderbot-local
              resources:
                requests:
                  storage: 200Gi
          - apiVersion: inference.llmkube.dev/v1alpha1
            kind: Model
            metadata:
              name: qwen38-27b-nvfp4-ninfer
              namespace: llm
            spec:
              source: https://huggingface.co/neroued/Qwen3.8-27B-nvfp4-NInfer/resolve/3b84117e0fd258b45bd79778ec8d8f27a4ab3d56/qwen3_8_27b_nvfp4.ninfer
              sha256: bb3360522a06e136e0367f5703414d26272b7285c8a6ab6194135c17dbd81b32
              format: custom
              quantization: nvfp4
              refreshPolicy: IfNotPresent
              hardware:
                accelerator: cuda
                gpu:
                  enabled: true
                  count: 1
                  vendor: nvidia
          - apiVersion: inference.llmkube.dev/v1alpha1
            kind: InferenceService
            metadata:
              name: qwen38-27b
              namespace: llm
            spec:
              modelRef: qwen38-27b-nvfp4-ninfer
              runtime: generic
              image: ghcr.io/dean-amer-dev/murderbot-llm@sha256:6ee1e235b1361f2b00eec09f72f1dd5157f01c917cb36ad35c50238f4ab2d222
              replicas: 1
              containerPort: 8080
              endpoint:
                port: 8080
                type: ClusterIP
              runtimeClassName: nvidia
              nodeSelector:
                gpu-worker: "true"
              tolerations:
                - key: gpu-worker
                  operator: Equal
                  value: "true"
                  effect: NoSchedule
              env:
                - name: MODEL_URL
                  value: https://huggingface.co/neroued/Qwen3.8-27B-nvfp4-NInfer/resolve/3b84117e0fd258b45bd79778ec8d8f27a4ab3d56/qwen3_8_27b_nvfp4.ninfer
                - name: MODEL_SHA256
                  value: bb3360522a06e136e0367f5703414d26272b7285c8a6ab6194135c17dbd81b32
                - name: MODEL_FILE
                  value: /models/qwen3.8-27b/3b84117/qwen3_8_27b_nvfp4.ninfer
                - name: MODEL_REPO
                  value: neroued/Qwen3.8-27B-nvfp4-NInfer
                - name: MODEL_REVISION
                  value: 3b84117e0fd258b45bd79778ec8d8f27a4ab3d56
              extraVolumes:
                - name: models
                  persistentVolumeClaim:
                    claimName: llm-models
              extraVolumeMounts:
                - name: models
                  mountPath: /models
              probeOverrides:
                startup:
                  tcpSocket:
                    port: 8080
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 360
                readiness:
                  httpGet:
                    path: /health
                    port: 8080
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              resources:
                gpu: 1
                cpu: "8"
                memory: 28Gi
              args:
                - $(MODEL_FILE)
                - --host
                - 0.0.0.0
                - --port
                - "8080"
                - --model-id
                - qwen3.8-27b
                - --kv-dtype
                - nvfp4
                - --max-context
                - "180224"
                - --spec
                - mtp
                - --draft-tokens
                - "3"
                - --max-concurrency
                - "1"
                - --device-state-slots
                - "0"
          - apiVersion: inference.llmkube.dev/v1alpha1
            kind: Model
            metadata:
              name: qwen38-27b-hauhau-ninfer
              namespace: llm
            spec:
              source: https://huggingface.co/WaveCut/Qwen3.8-27B-Uncensored-HauhauCS-Aggressive-DFlash2-NInfer-v3/resolve/aa777ba5f8ee7875a575baeb978abbad0d03f47b/qwen3_8_27b_hauhaucs_aggressive_dflash2.ninfer
              sha256: e2f2b0dbd5a23085d21cec99894074f392b51934cd45a282f5c04b08a6fa18a8
              format: custom
              quantization: nvfp4
              refreshPolicy: IfNotPresent
              hardware:
                accelerator: cuda
                gpu:
                  enabled: true
                  count: 1
                  vendor: nvidia
          - apiVersion: inference.llmkube.dev/v1alpha1
            kind: InferenceService
            metadata:
              name: qwen38-27b-uncensored
              namespace: llm
            spec:
              modelRef: qwen38-27b-hauhau-ninfer
              runtime: generic
              image: ghcr.io/dean-amer-dev/murderbot-llm@sha256:6ee1e235b1361f2b00eec09f72f1dd5157f01c917cb36ad35c50238f4ab2d222
              replicas: 0
              containerPort: 8080
              endpoint:
                port: 8080
                type: ClusterIP
              runtimeClassName: nvidia
              nodeSelector:
                gpu-worker: "true"
              tolerations:
                - key: gpu-worker
                  operator: Equal
                  value: "true"
                  effect: NoSchedule
              env:
                - name: MODEL_URL
                  value: https://huggingface.co/WaveCut/Qwen3.8-27B-Uncensored-HauhauCS-Aggressive-DFlash2-NInfer-v3/resolve/aa777ba5f8ee7875a575baeb978abbad0d03f47b/qwen3_8_27b_hauhaucs_aggressive_dflash2.ninfer
                - name: MODEL_SHA256
                  value: e2f2b0dbd5a23085d21cec99894074f392b51934cd45a282f5c04b08a6fa18a8
                - name: MODEL_FILE
                  value: /models/qwen3.8-27b-hauhau/aa777ba/qwen3_8_27b_hauhaucs_aggressive_dflash2.ninfer
                - name: MODEL_REPO
                  value: WaveCut/Qwen3.8-27B-Uncensored-HauhauCS-Aggressive-DFlash2-NInfer-v3
                - name: MODEL_REVISION
                  value: aa777ba5f8ee7875a575baeb978abbad0d03f47b
              extraVolumes:
                - name: models
                  persistentVolumeClaim:
                    claimName: llm-models
              extraVolumeMounts:
                - name: models
                  mountPath: /models
              probeOverrides:
                startup:
                  tcpSocket:
                    port: 8080
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 360
                readiness:
                  httpGet:
                    path: /health
                    port: 8080
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              resources:
                gpu: 1
                cpu: "8"
                memory: 28Gi
              args:
                - $(MODEL_FILE)
                - --host
                - 0.0.0.0
                - --port
                - "8080"
                - --model-id
                - qwen3.8-27b-uncensored
                - --kv-dtype
                - nvfp4
                - --max-context
                - "180224"
                - --spec
                - mtp
                - --draft-tokens
                - "3"
                - --max-concurrency
                - "1"
                - --device-state-slots
                - "0"
          - apiVersion: inference.llmkube.dev/v1alpha1
            kind: Model
            metadata:
              name: qwen35-9b-mlx
              namespace: llm
            spec:
              source: /Users/alex/.omlx/models/mlx-community/Qwen3.5-9B-MLX-4bit
              format: mlx
              hardware:
                accelerator: metal
          - apiVersion: inference.llmkube.dev/v1alpha1
            kind: InferenceService
            metadata:
              name: qwen35-9b-mini
              namespace: llm
            spec:
              modelRef: qwen35-9b-mlx
              runtime: omlx
              replicas: 1
          - apiVersion: inference.llmkube.dev/v1alpha1
            kind: Model
            metadata:
              name: modernbert-embed-mlx
              namespace: llm
            spec:
              source: /Users/alex/.omlx/models/mlx-community/nomicai-modernbert-embed-base-8bit
              format: mlx
              hardware:
                accelerator: metal
          - apiVersion: inference.llmkube.dev/v1alpha1
            kind: InferenceService
            metadata:
              name: modernbert-embed-mini
              namespace: llm
            spec:
              modelRef: modernbert-embed-mlx
              runtime: omlx
              replicas: 1
          - apiVersion: inference.llmkube.dev/v1alpha1
            kind: Model
            metadata:
              name: qwen35-9b-hauhau-mlx
              namespace: llm
            spec:
              source: /Users/alex/.omlx/models/TheCluster/Qwen3.5-9B-Uncensored-HauhauCS-Aggressive-MLX-mxfp4
              format: mlx
              hardware:
                accelerator: metal
          - apiVersion: inference.llmkube.dev/v1alpha1
            kind: InferenceService
            metadata:
              name: qwen35-9b-uncensored-mini
              namespace: llm
            spec:
              modelRef: qwen35-9b-hauhau-mlx
              runtime: omlx
              replicas: 0
          - apiVersion: inference.llmkube.dev/v1alpha1
            kind: ModelRouter
            metadata:
              name: llm
              namespace: llm
            spec:
              dataPlane: Proxy
              defaultRouteStrategy: BackendNameMatch
              defaultRoute: qwen38-27b
              proxy:
                replicas: 2
              endpoint:
                type: ClusterIP
                port: 8080
                path: /v1/chat/completions
              backends:
                - name: qwen38-27b
                  displayName: qwen3.8-27b
                  resolution: service
                  tier: local
                  external:
                    provider: openai
                    url: http://qwen38-27b.llm.svc.cluster.local:8080
                    model: qwen3.8-27b
                - name: qwen35-9b-mini
                  displayName: Qwen3.5-9B-MLX-4bit
                  resolution: service
                  tier: local
                  external:
                    provider: openai
                    url: http://qwen35-9b-mini.llm.svc.cluster.local:8080
                    model: Qwen3.5-9B-MLX-4bit
                - name: modernbert-embed-mini
                  displayName: nomicai-modernbert-embed-base-8bit
                  resolution: service
                  tier: local
                  external:
                    provider: openai
                    url: http://modernbert-embed-mini.llm.svc.cluster.local:8080
                    model: nomicai-modernbert-embed-base-8bit
                - name: qwen38-27b-uncensored
                  displayName: qwen3.8-27b-uncensored
                  resolution: service
                  tier: local
                  external:
                    provider: openai
                    url: http://qwen38-27b-uncensored.llm.svc.cluster.local:8080
                    model: qwen3.8-27b-uncensored
                - name: qwen35-9b-uncensored-mini
                  displayName: Qwen3.5-9B-Uncensored-HauhauCS-Aggressive-MLX-mxfp4
                  resolution: service
                  tier: local
                  external:
                    provider: openai
                    url: http://qwen35-9b-uncensored-mini.llm.svc.cluster.local:8080
                    model: Qwen3.5-9B-Uncensored-HauhauCS-Aggressive-MLX-mxfp4
  ignoreDifferences:
    - group: inference.llmkube.dev
      kind: InferenceService
      jsonPointers:
        - /spec/replicas
  destination:
    server: https://kubernetes.default.svc
    namespace: llm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
