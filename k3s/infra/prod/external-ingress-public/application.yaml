apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-ingress-public
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://bedag.github.io/helm-charts/
      chart: raw
      targetRevision: 2.0.2
      helm:
        values: |
          resources:
            # The only internet-facing entry point. The EdgeRouter forwards
            # WAN :443 to 10.100.20.206, which only the ingress-public Gateway
            # can hold (pool below). Every Ingress elsewhere stays on the
            # LAN-only shared IP 10.100.20.171. Anything public is added here.
            - apiVersion: v1
              kind: Namespace
              metadata:
                name: ingress-public
            - apiVersion: cilium.io/v2
              kind: CiliumLoadBalancerIPPool
              metadata:
                name: ingress-public
              spec:
                blocks:
                  - cidr: 10.100.20.206/32
                serviceSelector:
                  matchLabels:
                    io.kubernetes.service.namespace: ingress-public
            - apiVersion: cert-manager.io/v1
              kind: Certificate
              metadata:
                name: ingress-public
                namespace: ingress-public
              spec:
                secretName: ingress-public-tls
                issuerRef:
                  kind: ClusterIssuer
                  name: letsencrypt-prod
                dnsNames:
                  - ha.pub.amer.dev
                  - pubhooks.amer.dev
            - apiVersion: agentgateway.dev/v1alpha1
              kind: AgentgatewayParameters
              metadata:
                name: ingress-public
                namespace: ingress-public
              spec:
                deployment:
                  spec:
                    replicas: 2
                service:
                  metadata:
                    annotations:
                      lbipam.cilium.io/ips: 10.100.20.206
                  spec:
                    type: LoadBalancer
            - apiVersion: gateway.networking.k8s.io/v1
              kind: Gateway
              metadata:
                name: ingress-public
                namespace: ingress-public
              spec:
                gatewayClassName: agentgateway
                infrastructure:
                  parametersRef:
                    group: agentgateway.dev
                    kind: AgentgatewayParameters
                    name: ingress-public
                listeners:
                  - name: https
                    protocol: HTTPS
                    port: 443
                    tls:
                      mode: Terminate
                      certificateRefs:
                        - group: ""
                          kind: Secret
                          name: ingress-public-tls
                    allowedRoutes:
                      namespaces:
                        from: Same

            - apiVersion: gateway.networking.k8s.io/v1
              kind: HTTPRoute
              metadata:
                name: ha-pub
                namespace: ingress-public
              spec:
                parentRefs:
                  - group: gateway.networking.k8s.io
                    kind: Gateway
                    name: ingress-public
                hostnames:
                  - ha.pub.amer.dev
                rules:
                  - matches:
                      - path:
                          type: PathPrefix
                          value: /auth/
                      - path:
                          type: PathPrefix
                          value: /api/google_assistant
                    backendRefs:
                      - group: ""
                        kind: Service
                        name: home-assistant-r3
                        namespace: home-assistant
                        port: 8080
                        weight: 1
            - apiVersion: gateway.networking.k8s.io/v1beta1
              kind: ReferenceGrant
              metadata:
                name: ingress-public
                namespace: home-assistant
              spec:
                from:
                  - group: gateway.networking.k8s.io
                    kind: HTTPRoute
                    namespace: ingress-public
                to:
                  - group: ""
                    kind: Service
                    name: home-assistant-r3
            - apiVersion: externaldns.k8s.io/v1alpha1
              kind: DNSEndpoint
              metadata:
                name: ha-pub-amer-dev
                namespace: default
              spec:
                endpoints:
                  - dnsName: ha.pub.amer.dev
                    recordTTL: 300
                    recordType: A
                    targets:
                      - 67.250.70.153

            - apiVersion: gateway.networking.k8s.io/v1
              kind: HTTPRoute
              metadata:
                name: pubhooks
                namespace: ingress-public
              spec:
                parentRefs:
                  - group: gateway.networking.k8s.io
                    kind: Gateway
                    name: ingress-public
                hostnames:
                  - pubhooks.amer.dev
                rules:
                  - matches:
                      - path:
                          type: PathPrefix
                          value: /listener/github/
                    backendRefs:
                      - group: ""
                        kind: Service
                        name: komodo
                        namespace: komodo
                        port: 9120
                        weight: 1
            - apiVersion: gateway.networking.k8s.io/v1beta1
              kind: ReferenceGrant
              metadata:
                name: ingress-public
                namespace: komodo
              spec:
                from:
                  - group: gateway.networking.k8s.io
                    kind: HTTPRoute
                    namespace: ingress-public
                to:
                  - group: ""
                    kind: Service
                    name: komodo
            - apiVersion: externaldns.k8s.io/v1alpha1
              kind: DNSEndpoint
              metadata:
                name: pubhooks-amer-dev
                namespace: default
              spec:
                endpoints:
                  - dnsName: pubhooks.amer.dev
                    recordTTL: 300
                    recordType: A
                    targets:
                      - 67.250.70.153
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
