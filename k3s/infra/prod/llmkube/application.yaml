apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: llmkube
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://defilantech.github.io/LLMKube
    chart: llmkube
    targetRevision: 0.10.1
    helm:
      values: |
        controllerManager:
          replicaCount: 2
          leaderElection:
            enabled: true
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      control-plane: controller-manager
        modelCache:
          enabled: true
          mode: perService
          storageClass: murderbot-local
          size: 80Gi
        modelSource:
          allowedHostPathRoots:
            - /Users/alex/.omlx/models
        webhook:
          certManager:
            enabled: true
        metrics:
          secure: false
        prometheus:
          serviceMonitor:
            enabled: true
          inferencePodMonitor:
            enabled: false
          routerPodMonitor:
            enabled: true
          prometheusRule:
            enabled: false
  ignoreDifferences:
    - group: monitoring.coreos.com
      kind: ServiceMonitor
      jqPathExpressions:
        - .spec.endpoints[].relabelings[].action
    - group: monitoring.coreos.com
      kind: PodMonitor
      jqPathExpressions:
        - .spec.podMetricsEndpoints[].relabelings[].action
  destination:
    server: https://kubernetes.default.svc
    namespace: llmkube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
