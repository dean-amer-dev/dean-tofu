apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-ingress-private
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://bedag.github.io/helm-charts/
      chart: raw
      targetRevision: 2.0.2
      helm:
        values: |
          resources:
            # ---------------------------------------------------------------
            # LAN/Tailscale-only services. Every Ingress below carries
            # ingress.cilium.io/loadbalancer-mode: dedicated + the same
            # lbipam.cilium.io/sharing-key, so the whole group is pulled off
            # the cluster's default shared Ingress IP (10.100.20.171 - the
            # one the router NATs public :80/:443 to for external-ingress-
            # public) onto one separate, non-forwarded private IP. Reachable
            # from LAN and Tailscale (the subnet router already advertises
            # 10.100.20.0/24) but never from the internet, by construction -
            # no IP-allowlist policy needed. See Projects/Infrastructure-2.0
            # notes for the full reasoning.
            # ---------------------------------------------------------------
            - apiVersion: v1
              kind: Service
              metadata:
                name: alertmanager-mini-external
                namespace: default
              spec:
                ports:
                  - port: 9093
                    targetPort: 9093
                    protocol: TCP
            - apiVersion: discovery.k8s.io/v1
              kind: EndpointSlice
              metadata:
                name: alertmanager-mini-external-1
                namespace: default
                labels:
                  kubernetes.io/service-name: alertmanager-mini-external
              addressType: IPv4
              endpoints:
                - addresses:
                    - 10.100.20.18
                  conditions:
                    ready: true
              ports:
                - name: ""
                  port: 9093
                  protocol: TCP
            - apiVersion: networking.k8s.io/v1
              kind: Ingress
              metadata:
                name: alertmanager-mini-ingress-amer-dev
                namespace: default
                annotations:
                  cert-manager.io/cluster-issuer: letsencrypt-prod
                  external-dns.alpha.kubernetes.io/hostname: alertmanager.amer.dev,alerts.amer.dev
                  external-dns.alpha.kubernetes.io/ttl: "300"
                  ingress.cilium.io/loadbalancer-mode: dedicated
                  lbipam.cilium.io/sharing-key: external-ingress-private
              spec:
                tls:
                  - hosts:
                      - alertmanager.amer.dev
                      - alerts.amer.dev
                    secretName: alertmanager-amer-dev-tls
                rules:
                  - host: alertmanager.amer.dev
                    http:
                      paths:
                        - path: /
                          pathType: Prefix
                          backend:
                            service:
                              name: alertmanager-mini-external
                              port:
                                number: 9093
                  - host: alerts.amer.dev
                    http:
                      paths:
                        - path: /
                          pathType: Prefix
                          backend:
                            service:
                              name: alertmanager-mini-external
                              port:
                                number: 9093

