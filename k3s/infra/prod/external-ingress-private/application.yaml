apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-ingress-private
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://bedag.github.io/helm-charts/
      chart: raw
      targetRevision: 2.0.2
      helm:
        values: |
          resources:
            # ---------------------------------------------------------------
            # LAN/Tailscale-only services. Nothing here is internet-facing:
            # public routes live only in external-ingress-public (WAN-forwarded
            # 10.100.20.206). The shared Ingress IP 10.100.20.171 is LAN-only.
            # ---------------------------------------------------------------
            - apiVersion: networking.k8s.io/v1
              kind: Ingress
              metadata:
                name: argocd-ingress-amer-dev
                namespace: argocd
                annotations:
                  cert-manager.io/cluster-issuer: letsencrypt-prod
                  external-dns.alpha.kubernetes.io/hostname: argo.amer.dev
                  external-dns.alpha.kubernetes.io/ttl: "300"
                  ingress.cilium.io/loadbalancer-mode: dedicated
                  lbipam.cilium.io/sharing-key: external-ingress-private
              spec:
                tls:
                  - hosts:
                      - argo.amer.dev
                    secretName: argocd-amer-dev-tls
                rules:
                  - host: argo.amer.dev
                    http:
                      paths:
                        - path: /
                          pathType: Prefix
                          backend:
                            service:
                              name: argocd-server
                              port:
                                number: 80
            - apiVersion: v1
              kind: Service
              metadata:
                name: comfyui-external
                namespace: default
              spec:
                ports:
                  - port: 8188
                    targetPort: 8188
                    protocol: TCP
            - apiVersion: discovery.k8s.io/v1
              kind: EndpointSlice
              metadata:
                name: comfyui-external-1
                namespace: default
                labels:
                  kubernetes.io/service-name: comfyui-external
              addressType: IPv4
              endpoints:
