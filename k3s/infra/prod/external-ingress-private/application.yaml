            # ---------------------------------------------------------------
            # Media stack (murderbot, 10.100.20.19). Ported from legacy's
            # single Traefik IngressRoute + media-allowlist Middleware
            # (k3s-dean-gitops/infra/ingresses/jellyfin-ingress-amer-dev.yaml)
            # - same hosts/ports, one wildcard cert, no per-ingress
            # cert-manager annotation (would create 11 duplicate Certificates
            # for the same secret - one explicit Certificate below instead).
            # Security here comes from being in this dedicated-mode group
            # (never WAN-forwarded), replacing the old ipAllowList Middleware
            # - not from an equivalent in-cluster policy.
            # ---------------------------------------------------------------
            - apiVersion: cert-manager.io/v1
              kind: Certificate
              metadata:
                name: media-amer-dev
                namespace: default
              spec:
                secretName: media-amer-dev-tls
                dnsNames:
                  - media.amer.dev
                  - "*.media.amer.dev"
                issuerRef:
                  name: letsencrypt-prod
                  kind: ClusterIssuer

            - apiVersion: v1
