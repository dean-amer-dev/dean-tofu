apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://bedag.github.io/helm-charts/
    chart: raw
    targetRevision: 2.0.2
    helm:
      values: |
        resources:
        - apiVersion: scheduling.k8s.io/v1
          kind: PriorityClass
          metadata:
            name: db-critical
          value: 1000000
          globalDefault: false
          description: Databases and Technitium - scheduled ahead of ordinary apps
        - apiVersion: postgresql.cnpg.io/v1
          kind: Cluster
          metadata:
            name: pg
            namespace: postgres
          spec:
            instances: 3
            imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
            priorityClassName: db-critical
            enableSuperuserAccess: true
            primaryUpdateStrategy: unsupervised
            postgresql:
              parameters:
                shared_buffers: 512MB
                max_connections: "200"
              extensions:
              - name: pgvector
                image:
                  reference: ghcr.io/cloudnative-pg/pgvector:0.8.6-202610011123-18-trixie@sha256:af88b0b09f85683cc981407bc53546ea410242fa0455fa2f2cd8d1dc56833413
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
              limits:
                memory: 2Gi
            storage:
              size: 20Gi
            affinity:
              enablePodAntiAffinity: true
              podAntiAffinityType: required
              topologyKey: kubernetes.io/hostname
        - apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: pg-backup-gcs
            namespace: postgres
          spec:
            refreshInterval: 1h
            secretStoreRef:
              name: bitwarden-secretsmanager
              kind: ClusterSecretStore
            target:
              name: pg-backup-gcs
              creationPolicy: Owner
              deletionPolicy: Retain
            data:
            - secretKey: access-key
              remoteRef:
                key: k3s-dean-backups-access-key
                conversionStrategy: Default
                decodingStrategy: None
                metadataPolicy: None
            - secretKey: secret-key
              remoteRef:
                key: k3s-dean-backups-secret-key
                conversionStrategy: Default
                decodingStrategy: None
                metadataPolicy: None
            - secretKey: endpoint
              remoteRef:
                key: k3s-dean-backups-endpoint
                conversionStrategy: Default
                decodingStrategy: None
                metadataPolicy: None
        - apiVersion: batch/v1
          kind: CronJob
          metadata:
            name: pg-backup
            namespace: postgres
          spec:
            schedule: "0 3 * * *"
            concurrencyPolicy: Forbid
            successfulJobsHistoryLimit: 3
            failedJobsHistoryLimit: 3
            jobTemplate:
              spec:
                backoffLimit: 2
                template:
                  spec:
                    restartPolicy: OnFailure
                    volumes:
                    - name: dump
                      emptyDir: {}
                    initContainers:
                    - name: pg-dump
                      image: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
                      env:
                      - name: PGHOST
                        value: pg-rw
                      - name: PGUSER
                        valueFrom:
                          secretKeyRef: {name: pg-superuser, key: username}
                      - name: PGPASSWORD
                        valueFrom:
                          secretKeyRef: {name: pg-superuser, key: password}
                      command: ["/bin/bash", "-euo", "pipefail", "-c"]
                      args:
                      - |
                        d=/dump/$(date -u +%Y-%m-%dT%H%M%SZ)
                        mkdir -p "$d"
                        pg_dumpall --globals-only > "$d/globals.sql"
                        for db in $(psql -d postgres -Atc "select datname from pg_database where not datistemplate and datname <> 'postgres'"); do
                          pg_dump -Fc -f "$d/$db.dump" "$db"
                          pg_restore -l "$d/$db.dump" > /dev/null
                        done
                        ls -l "$d"
                      volumeMounts:
                      - {name: dump, mountPath: /dump}
                      resources:
                        requests: {cpu: 100m, memory: 128Mi}
                        limits: {memory: 512Mi}
                    containers:
                    - name: upload
                      image: rclone/rclone:1.75.1
                      env:
                      - name: RCLONE_CONFIG_GCS_TYPE
                        value: s3
                      - name: RCLONE_CONFIG_GCS_PROVIDER
                        value: GCS
                      - name: RCLONE_CONFIG_GCS_NO_CHECK_BUCKET
                        value: "true"
                      - name: RCLONE_CONFIG_GCS_ACCESS_KEY_ID
                        valueFrom:
                          secretKeyRef: {name: pg-backup-gcs, key: access-key}
                      - name: RCLONE_CONFIG_GCS_SECRET_ACCESS_KEY
                        valueFrom:
                          secretKeyRef: {name: pg-backup-gcs, key: secret-key}
                      - name: RCLONE_CONFIG_GCS_ENDPOINT
                        valueFrom:
                          secretKeyRef: {name: pg-backup-gcs, key: endpoint}
                      command: ["/bin/sh", "-eu", "-c"]
                      args:
                      - |
                        dest=GCS:amerenda-backups/k3s-dean/postgres
                        n=0
                        up() {
                          rclone copyto "$1" "$2"
                          want=$(stat -c %s "$1")
                          got=$(rclone lsf --format s "$2")
                          [ "$want" = "$got" ] || { echo "BACKUP_FAILED size mismatch $2 local=$want remote=$got" >&2; exit 1; }
                          n=$((n+1))
                        }
                        for dir in /dump/*/; do
                          ts=$(basename "$dir")
                          for f in "$dir"*.dump; do
                            [ -e "$f" ] || continue
                            db=$(basename "$f" .dump)
                            up "$f" "$dest/$db/$ts-$db.dump"
                          done
                          up "$dir"globals.sql "$dest/_globals/$ts-globals.sql"
                        done
                        [ "$n" -gt 0 ] || { echo "BACKUP_FAILED no objects uploaded to $dest" >&2; exit 1; }
                        rclone delete --min-age 14d "$dest"
                        echo "BACKUP_OK objects=$n dest=$dest"
                      volumeMounts:
                      - {name: dump, mountPath: /dump}
                      resources:
                        requests: {cpu: 50m, memory: 64Mi}
                        limits: {memory: 256Mi}
        - apiVersion: batch/v1
          kind: CronJob
          metadata:
            name: pg-backup-verify
            namespace: postgres
          spec:
            schedule: "30 3 * * *"
            concurrencyPolicy: Forbid
            successfulJobsHistoryLimit: 3
            failedJobsHistoryLimit: 3
            jobTemplate:
              spec:
                backoffLimit: 2
                template:
                  spec:
                    restartPolicy: OnFailure
                    volumes:
                    - name: restore
                      emptyDir: {}
                    initContainers:
                    - name: fetch
                      image: rclone/rclone:1.75.1
                      env:
                      - name: RCLONE_CONFIG_GCS_TYPE
                        value: s3
                      - name: RCLONE_CONFIG_GCS_PROVIDER
                        value: GCS
                      - name: RCLONE_CONFIG_GCS_NO_CHECK_BUCKET
                        value: "true"
                      - name: RCLONE_CONFIG_GCS_ACCESS_KEY_ID
                        valueFrom:
                          secretKeyRef: {name: pg-backup-gcs, key: access-key}
                      - name: RCLONE_CONFIG_GCS_SECRET_ACCESS_KEY
                        valueFrom:
                          secretKeyRef: {name: pg-backup-gcs, key: secret-key}
                      - name: RCLONE_CONFIG_GCS_ENDPOINT
                        valueFrom:
                          secretKeyRef: {name: pg-backup-gcs, key: endpoint}
                      command: ["/bin/sh", "-eu", "-c"]
                      args:
                      - |
                        dest=GCS:amerenda-backups/k3s-dean/postgres
                        n=0
                        for db in $(rclone lsf --dirs-only "$dest/" | tr -d '/' | grep -v '^_'); do
                          f=$(rclone lsf --files-only "$dest/$db/" | sort | tail -n1)
                          [ -n "$f" ] || { echo "VERIFY_FAILED no dump for $db" >&2; exit 1; }
                          rclone copyto "$dest/$db/$f" "/restore/$db.dump"
                          echo "$f" > "/restore/$db.name"
                          echo "fetched $db/$f"
                          n=$((n+1))
                        done
                        [ "$n" -gt 0 ] || { echo "VERIFY_FAILED no databases found under $dest" >&2; exit 1; }
                      volumeMounts:
                      - {name: restore, mountPath: /restore}
                      resources:
                        requests: {cpu: 50m, memory: 64Mi}
                        limits: {memory: 256Mi}
                    containers:
                    - name: verify
                      image: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
                      env:
                      - name: PGHOST
                        value: pg-rw
                      - name: PGUSER
                        valueFrom:
                          secretKeyRef: {name: pg-superuser, key: username}
                      - name: PGPASSWORD
                        valueFrom:
                          secretKeyRef: {name: pg-superuser, key: password}
                      command: ["/bin/bash", "-euo", "pipefail", "-c"]
                      args:
                      - |
                        failed=0
                        for f in /restore/*.dump; do
                          db=$(basename "$f" .dump)
                          name=$(cat "/restore/$db.name")
                          ts=${name%-"$db".dump}
                          when=$(echo "$ts" | sed -E 's/T([0-9]{2})([0-9]{2})([0-9]{2})Z/ \1:\2:\3 UTC/')
                          age=$(( $(date +%s) - $(date -d "$when" +%s) ))
                          if [ "$age" -gt 172800 ]; then echo "VERIFY_FAILED $db newest dump $name is ${age}s old (limit 172800)" >&2; failed=1; continue; fi
                          scratch="restore_verify_$(echo "$db" | tr -c 'a-z0-9\n' '_')"
                          psql -d postgres -qc "drop database if exists $scratch" -c "create database $scratch"
                          expected=$(pg_restore -l "$f" | grep -cE '^[0-9]+; [0-9]+ [0-9]+ TABLE ' || true)
                          if ! pg_restore --no-owner --no-privileges --exit-on-error -d "$scratch" "$f"; then
                            echo "VERIFY_FAILED $db restore errored" >&2; failed=1
                          else
                            tables=$(psql -d "$scratch" -Atc "select count(*) from information_schema.tables where table_type = 'BASE TABLE' and table_schema not in ('pg_catalog','information_schema')")
                            rows=0
                            for t in $(psql -d "$scratch" -Atc "select format('%I.%I', table_schema, table_name) from information_schema.tables where table_type = 'BASE TABLE' and table_schema not in ('pg_catalog','information_schema')"); do
                              c=$(psql -d "$scratch" -Atc "select count(*) from $t")
                              rows=$((rows + c))
                            done
                            if [ "$tables" != "$expected" ]; then
                              echo "VERIFY_FAILED $db tables restored=$tables expected=$expected" >&2; failed=1
                            else
                              echo "VERIFY_OK $db dump=$name tables=$tables rows=$rows"
                            fi
                          fi
                          psql -d postgres -qc "drop database if exists $scratch"
                        done
                        [ "$failed" = "0" ] || exit 1
                        echo "VERIFY_ALL_OK"
                      volumeMounts:
                      - {name: restore, mountPath: /restore}
                      resources:
                        requests: {cpu: 100m, memory: 128Mi}
                        limits: {memory: 512Mi}
  destination:
    server: https://kubernetes.default.svc
    namespace: postgres
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 5m
