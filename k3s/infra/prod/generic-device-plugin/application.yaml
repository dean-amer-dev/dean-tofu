apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: generic-device-plugin
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://bedag.github.io/helm-charts/
    chart: raw
    targetRevision: 2.0.2
    helm:
      values: |
        resources:
        - apiVersion: apps/v1
          kind: DaemonSet
          metadata:
            name: generic-device-plugin
            namespace: kube-system
            labels:
              app.kubernetes.io/name: generic-device-plugin
          spec:
            selector:
              matchLabels:
                app.kubernetes.io/name: generic-device-plugin
            updateStrategy:
              type: RollingUpdate
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: generic-device-plugin
              spec:
                priorityClassName: system-node-critical
                containers:
                - name: generic-device-plugin
                  image: squat/generic-device-plugin:2cc50b0
                  args:
                  - --device
                  - |
                    name: dri
                    groups:
                      - paths:
                          - path: /dev/dri/renderD128
                  ports:
                  - {name: http, containerPort: 8080}
                  resources:
                    requests:
                      cpu: 50m
                      memory: 10Mi
                    limits:
                      cpu: 50m
                      memory: 20Mi
                  securityContext:
                    privileged: true
                  volumeMounts:
                  - {name: device-plugin, mountPath: /var/lib/kubelet/device-plugins}
                  - {name: dev, mountPath: /dev}
                volumes:
                - name: device-plugin
                  hostPath:
                    path: /var/lib/kubelet/device-plugins
                - name: dev
                  hostPath:
                    path: /dev
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
