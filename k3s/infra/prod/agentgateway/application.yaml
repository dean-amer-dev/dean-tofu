apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agentgateway
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: cr.agentgateway.dev/charts
      chart: agentgateway-crds
      targetRevision: 1.6.0
    - repoURL: cr.agentgateway.dev/charts
      chart: agentgateway
      targetRevision: 1.6.0
      helm:
        values: |
          controller:
            replicaCount: 2
    - repoURL: https://bedag.github.io/helm-charts/
      chart: raw
      targetRevision: 2.0.2
      helm:
        values: |
          resources:
            - apiVersion: agentgateway.dev/v1alpha1
              kind: AgentgatewayParameters
              metadata:
                name: agentgateway-proxy
                namespace: agentgateway-system
              spec:
                deployment:
                  spec:
                    replicas: 2
                service:
                  spec:
                    type: ClusterIP
            - apiVersion: gateway.networking.k8s.io/v1
              kind: Gateway
              metadata:
                name: agentgateway-proxy
                namespace: agentgateway-system
              spec:
                gatewayClassName: agentgateway
                infrastructure:
                  parametersRef:
                    group: agentgateway.dev
                    kind: AgentgatewayParameters
                    name: agentgateway-proxy
                listeners:
                  - name: http
                    protocol: HTTP
                    port: 80
                    allowedRoutes:
                      namespaces:
                        from: Same
            - apiVersion: external-secrets.io/v1
              kind: ExternalSecret
              metadata:
                name: model-switch-mcp-token
                namespace: agentgateway-system
              spec:
                refreshInterval: 1h
                secretStoreRef:
                  name: bitwarden-secretsmanager
                  kind: ClusterSecretStore
                target:
                  name: model-switch-mcp-token
                  creationPolicy: Owner
                  deletionPolicy: Retain
                data:
                  - secretKey: token
                    remoteRef:
                      key: model-switch-mcp-bearer-token
                      conversionStrategy: Default
                      decodingStrategy: None
                      metadataPolicy: None
            - apiVersion: agentgateway.dev/v1alpha1
              kind: AgentgatewayBackend
              metadata:
                name: mcp
                namespace: agentgateway-system
              spec:
                mcp:
                  sessionRouting: Stateless
                  prefixMode: Always
                  failureMode: FailOpen
                  targets:
                    - name: discovered
                      selector:
                        services:
                          matchLabels:
                            mcp.amer.dev/expose: "true"
                        namespaces:
                          matchLabels:
                            kubernetes.io/metadata.name: mcp
                    - name: model-switch
                      static:
                        host: model-switch-mcp-server.mcp.svc.cluster.local
                        port: 8000
                        path: /mcp
                        protocol: StreamableHTTP
                        policies:
                          auth:
                            secretRef:
                              name: model-switch-mcp-token
                              key: token
            - apiVersion: gateway.networking.k8s.io/v1
              kind: HTTPRoute
              metadata:
                name: mcp
                namespace: agentgateway-system
              spec:
                parentRefs:
                  - group: gateway.networking.k8s.io
                    kind: Gateway
                    name: agentgateway-proxy
                rules:
                  - matches:
                      - path:
                          type: PathPrefix
                          value: /mcp
                    backendRefs:
                      - group: agentgateway.dev
                        kind: AgentgatewayBackend
                        name: mcp
                        weight: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: agentgateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
