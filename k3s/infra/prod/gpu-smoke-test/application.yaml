apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gpu-smoke-test
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://bedag.github.io/helm-charts/
    chart: raw
    targetRevision: 2.0.2
    helm:
      values: |
        resources:
        - apiVersion: v1
          kind: Pod
          metadata:
            name: xnode-server
            namespace: gpu-smoke-test
            labels:
              app: xnode-server
          spec:
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                  - matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: Exists
            tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
            containers:
            - name: httpd
              image: docker.io/library/busybox:1.37
              command: ["sh", "-c", "echo xnode-ok > /tmp/index.html && httpd -f -p 8080 -h /tmp"]
              ports:
              - containerPort: 8080
        - apiVersion: v1
          kind: Service
          metadata:
            name: xnode-server
            namespace: gpu-smoke-test
          spec:
            selector:
              app: xnode-server
            ports:
            - port: 8080
              targetPort: 8080
        - apiVersion: batch/v1
          kind: Job
          metadata:
            name: xnode-client
            namespace: gpu-smoke-test
          spec:
            backoffLimit: 6
            template:
              spec:
                restartPolicy: OnFailure
                nodeSelector:
                  gpu-worker: "true"
                tolerations:
                - key: gpu-worker
                  operator: Equal
                  value: "true"
                  effect: NoSchedule
                containers:
                - name: client
                  image: docker.io/library/busybox:1.37
                  command:
                  - sh
                  - -c
                  - |
                    set -e
                    echo "client node: $(hostname)"
                    echo "via Service DNS:"; wget -qO- -T 5 http://xnode-server.gpu-smoke-test.svc:8080/
                    echo "via ClusterIP env-less DNS lookup:"; nslookup kubernetes.default.svc.cluster.local | tail -3
        - apiVersion: batch/v1
          kind: Job
          metadata:
            name: gpu-smi
            namespace: gpu-smoke-test
          spec:
            backoffLimit: 3
            template:
              spec:
                restartPolicy: OnFailure
                runtimeClassName: nvidia
                nodeSelector:
                  gpu-worker: "true"
                tolerations:
                - key: gpu-worker
                  operator: Equal
                  value: "true"
                  effect: NoSchedule
                containers:
                - name: smi
                  image: docker.io/library/ubuntu:24.04
                  command: ["nvidia-smi"]
                  env:
                  - {name: NVIDIA_VISIBLE_DEVICES, value: all}
                  - {name: NVIDIA_DRIVER_CAPABILITIES, value: "utility,compute"}
        - apiVersion: batch/v1
          kind: Job
          metadata:
            name: llama-bench
            namespace: gpu-smoke-test
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                runtimeClassName: nvidia
                nodeSelector:
                  gpu-worker: "true"
                tolerations:
                - key: gpu-worker
                  operator: Equal
                  value: "true"
                  effect: NoSchedule
                containers:
                - name: bench
                  image: ghcr.io/ggml-org/llama.cpp:full-cuda13
                  command: ["/app/llama-bench"]
                  args:
                  - -m
                  - /models/hub/models--ggml-org--Qwen3.8-27B-GGUF/snapshots/0669b98607d47046c7c2b3f801011d54a08cfccf/Qwen3.8-27B-Q4_K_M.gguf
                  - -ngl
                  - "99"
                  - -fa
                  - "1"
                  - -p
                  - "512"
                  - -n
                  - "128"
                  - -r
                  - "3"
                  env:
                  - {name: NVIDIA_VISIBLE_DEVICES, value: all}
                  - {name: NVIDIA_DRIVER_CAPABILITIES, value: "utility,compute"}
                  volumeMounts:
                  - {name: models, mountPath: /models, readOnly: true}
                volumes:
                - name: models
                  hostPath:
                    path: /mnt/storage/models/hf-cache
        - apiVersion: batch/v1
          kind: Job
          metadata:
            name: ninfer-help
            namespace: gpu-smoke-test
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                runtimeClassName: nvidia
                nodeSelector:
                  gpu-worker: "true"
                tolerations:
                - key: gpu-worker
                  operator: Equal
                  value: "true"
                  effect: NoSchedule
                containers:
                - name: help
                  image: ghcr.io/dean-amer-dev/murderbot-llm@sha256:21d9ab3e10ec2148a5fc3b69a29295642053d3ae5547625c18b0cb121db8da91
                  args: ["--help"]
                  env:
                  - {name: NVIDIA_VISIBLE_DEVICES, value: all}
                  - {name: NVIDIA_DRIVER_CAPABILITIES, value: "utility,compute"}
  destination:
    server: https://kubernetes.default.svc
    namespace: gpu-smoke-test
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
