apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: blackbox-exporter
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-blackbox-exporter
    targetRevision: 11.20.0
    helm:
      values: |
        fullnameOverride: blackbox-exporter
        deploymentAnnotations:
          reloader.stakater.com/auto: 'true'
        securityContext:
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - NET_RAW
        config:
          modules:
            https_2xx:
              prober: http
              timeout: 10s
              http:
                preferred_ip_protocol: ip4
                follow_redirects: true
                fail_if_ssl: false
                fail_if_not_ssl: true
                valid_http_versions:
                - HTTP/2.0
                - HTTP/1.1
                valid_status_codes: []
                tls_config:
                  insecure_skip_verify: false
                headers:
                  User-Agent: blackbox-health-probe/1.0
            https_auth_required:
              prober: http
              timeout: 10s
              http:
                preferred_ip_protocol: ip4
                follow_redirects: true
                fail_if_not_ssl: true
                valid_status_codes: [200, 401]
                headers:
                  User-Agent: blackbox-health-probe/1.0
            tcp_connect:
              prober: tcp
              timeout: 5s
            http_2xx:
              prober: http
              timeout: 10s
              http:
                preferred_ip_protocol: ip4
                follow_redirects: true
                valid_http_versions:
                - HTTP/2.0
                - HTTP/1.1
                valid_status_codes: []
                headers:
                  User-Agent: blackbox-health-probe/1.0
            icmp:
              prober: icmp
              timeout: 5s
            dns_technitium:
              prober: dns
              timeout: 5s
              dns:
                query_name: ha.amer.dev
                query_type: A
                valid_rcodes:
                - NOERROR
            dns_technitium_adblock:
              prober: dns
              timeout: 5s
              dns:
                query_name: doubleclick.net
                query_type: A
                valid_rcodes:
                - NXDOMAIN
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - ServerSideApply=true
