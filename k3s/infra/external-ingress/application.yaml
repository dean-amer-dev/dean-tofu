apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-ingress
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://bedag.github.io/helm-charts/
      chart: raw
      targetRevision: 2.0.2
      helm:
        values: |
          resources:
            - apiVersion: v1
              kind: Service
              metadata:
                name: alertmanager-mini-external
                namespace: default
              spec:
                ports:
                  - port: 9093
                    targetPort: 9093
                    protocol: TCP
            - apiVersion: discovery.k8s.io/v1
              kind: EndpointSlice
              metadata:
                name: alertmanager-mini-external-1
                namespace: default
                labels:
                  kubernetes.io/service-name: alertmanager-mini-external
              addressType: IPv4
              endpoints:
                - addresses:
                    - 10.100.20.18
                  conditions:
                    ready: true
              ports:
                - name: ""
                  port: 9093
                  protocol: TCP
            - apiVersion: networking.k8s.io/v1
              kind: Ingress
              metadata:
                name: alertmanager-mini-ingress-amer-dev
                namespace: default
                annotations:
                  cert-manager.io/cluster-issuer: letsencrypt-prod
                  external-dns.alpha.kubernetes.io/hostname: alertmanager.amer.dev,alerts.amer.dev
                  external-dns.kubernetes.io/target: 10.100.20.171
                  external-dns.alpha.kubernetes.io/ttl: "300"
              spec:
                tls:
                  - hosts:
                      - alertmanager.amer.dev
                      - alerts.amer.dev
                    secretName: alertmanager-amer-dev-tls
                rules:
                  - host: alertmanager.amer.dev
                    http:
                      paths:
                        - path: /
                          pathType: Prefix
                          backend:
                            service:
                              name: alertmanager-mini-external
                              port:
                                number: 9093
                  - host: alerts.amer.dev
                    http:
                      paths:
                        - path: /
                          pathType: Prefix
                          backend:
                            service:
                              name: alertmanager-mini-external
                              port:
                                number: 9093

            - apiVersion: v1
              kind: Service
              metadata:
                name: comfyui-external
                namespace: default
              spec:
                ports:
                  - port: 8188
                    targetPort: 8188
                    protocol: TCP
            - apiVersion: discovery.k8s.io/v1
              kind: EndpointSlice
              metadata:
                name: comfyui-external-1
                namespace: default
                labels:
                  kubernetes.io/service-name: comfyui-external
              addressType: IPv4
              endpoints:
                - addresses:
                    - 10.100.20.19
                  conditions:
                    ready: true
              ports:
                - name: ""
                  port: 8188
                  protocol: TCP
            - apiVersion: networking.k8s.io/v1
              kind: Ingress
              metadata:
                name: comfyui-ingress-amer-dev
                namespace: default
                annotations:
                  cert-manager.io/cluster-issuer: letsencrypt-prod
                  external-dns.alpha.kubernetes.io/hostname: comfy.amer.dev
                  external-dns.kubernetes.io/target: 10.100.20.171
                  external-dns.alpha.kubernetes.io/ttl: "300"
              spec:
                tls:
                  - hosts:
                      - comfy.amer.dev
                    secretName: comfy-amer-dev-tls
                rules:
                  - host: comfy.amer.dev
                    http:
                      paths:
                        - path: /
                          pathType: Prefix
                          backend:
                            service:
                              name: comfyui-external
                              port:
                                number: 8188

            - apiVersion: v1
              kind: Service
              metadata:
