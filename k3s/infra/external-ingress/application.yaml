            - apiVersion: v1
              kind: Service
              metadata:
                name: komodo-external
                namespace: default
              spec:
                ports:
                  - port: 9120
                    targetPort: 9120
                    protocol: TCP
            - apiVersion: discovery.k8s.io/v1
              kind: EndpointSlice
              metadata:
                name: komodo-external-1
                namespace: default
                labels:
                  kubernetes.io/service-name: komodo-external
              addressType: IPv4
              endpoints:
                - addresses:
                    - 10.100.20.18
                  conditions:
                    ready: true
              ports:
                - name: ""
                  port: 9120
                  protocol: TCP
            - apiVersion: networking.k8s.io/v1
              kind: Ingress
              metadata:
                name: komodo-ingress-amer-dev
                namespace: default
                annotations:
                  cert-manager.io/cluster-issuer: letsencrypt-prod
                  external-dns.alpha.kubernetes.io/hostname: komodo.amer.dev
                  external-dns.kubernetes.io/target: 10.100.20.171
