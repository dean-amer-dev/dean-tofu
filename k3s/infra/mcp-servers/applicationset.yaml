apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: mcp-servers
  namespace: argocd
spec:
  # One ApplicationSet for all 9 MCP servers dropped from litellm's mcp_servers block when it was
  # ported off the (now permanently dead) legacy k3s control plane - see
  # instructions/infra2-infra-tier-plan-draft.md Phase D /
  # instructions/infra2-infra-tier-background-draft.md for the full decision log. Same List
  # generator + Go-template mechanism as k3s/app-of-apps/applicationset.yaml, adapted for
  # hand-rolled manifests: every element points at the same bedag/raw chart (rather than each
  # element's own upstream chart, as in the app-of-apps tier) and carries its own `resources:`
  # list (Deployment/Service/ExternalSecret/Ingress as needed) inlined into valuesYaml.
  #
  # Deployed one server at a time, not all 9 at once: add the next element to this list, commit,
  # `tofu apply`, verify that one server end-to-end (through litellm's mcp_servers block AND
  # directly, where it has its own ingress) before adding the next. obsidian-mcp goes first - see
  # the background note's priority order.
  generators:
    - list:
        elements:
          # Legacy source: k3s-dean-gitops/apps/mcp/obsidian/ (deployment.yaml, service.yaml,
          # externalsecret.yaml, ingress.yaml). Only change from legacy: externalsecret.yaml's
          # secretStoreRef.name fixed bitwarden-secretstore -> bitwarden-secretsmanager (the
          # actual live ClusterSecretStore on gmktec - same fix as litellm's), ingress.yaml's
          # Traefik-specific annotations + ingressClassName dropped (Cilium is cluster-default).
          # letsencrypt-prod kept as-is per Alex's 2026-09-29 call (cert-manager's issuance path
          # is verified, new gmktec ingresses go straight to prod). Depends on couchdb.amer.dev
          # (already live via external-ingress-private, Phase B) - no new dependency to stand up.
          - name: obsidian-mcp
            namespace: mcp-obsidian
            valuesYaml: |
              resources:
                - apiVersion: external-secrets.io/v1
                  kind: ExternalSecret
                  metadata:
                    name: obsidian-mcp-secrets
                    namespace: mcp-obsidian
                  spec:
                    refreshInterval: 1h
                    secretStoreRef:
                      name: bitwarden-secretsmanager
                      kind: ClusterSecretStore
                    target:
                      name: obsidian-mcp-secrets
                      creationPolicy: Owner
                      deletionPolicy: Retain
                    data:
                      - secretKey: couchdb_password
                        remoteRef:
                          key: obsidian-mcp-bridge-couchdb-password
                          conversionStrategy: Default
                          decodingStrategy: None
                          metadataPolicy: None
                      - secretKey: e2ee_passphrase
                        remoteRef:
                          key: obsidian-livesync-e2e-passphrase
                          conversionStrategy: Default
                          decodingStrategy: None
                          metadataPolicy: None
                - apiVersion: v1
                  kind: Service
                  metadata:
                    name: obsidian-mcp-server
                    namespace: mcp-obsidian
                  spec:
                    selector:
                      app: obsidian-mcp-server
                    ports:
                      - port: 8787
                        targetPort: 8787
                        protocol: TCP
                - apiVersion: apps/v1
                  kind: Deployment
                  metadata:
                    name: obsidian-mcp-server
                    namespace: mcp-obsidian
                  spec:
                    replicas: 1
                    selector:
                      matchLabels:
                        app: obsidian-mcp-server
                    template:
                      metadata:
                        labels:
                          app: obsidian-mcp-server
                      spec:
                        containers:
                          - name: server
                            image: ghcr.io/es617/obsidian-sync-mcp:latest
                            imagePullPolicy: Always
                            ports:
                              - containerPort: 8787
                            env:
                              - name: COUCHDB_URL
                                value: 'https://couchdb.amer.dev'
                              - name: COUCHDB_USER
                                value: 'obsidian-mcp-bridge'
                              - name: COUCHDB_DATABASE
                                value: 'obsidian-dean'
                              - name: COUCHDB_OBFUSCATE_PROPERTIES
                                value: 'false'
                              - name: VAULT_NAME
                                value: 'Dean'
                              - name: PORT
                                value: '8787'
                              - name: MCP_ALLOWED_HOSTS
                                value: 'obsidian-mcp-server,obsidian-mcp-server.mcp-obsidian,obsidian-mcp-server.mcp-obsidian.svc,obsidian-mcp-server.mcp-obsidian.svc.cluster.local,mcp-obsidian.amer.dev'
                              - name: COUCHDB_PASSWORD
                                valueFrom:
                                  secretKeyRef:
                                    name: obsidian-mcp-secrets
                                    key: couchdb_password
                              - name: COUCHDB_PASSPHRASE
                                valueFrom:
                                  secretKeyRef:
                                    name: obsidian-mcp-secrets
                                    key: e2ee_passphrase
                            readinessProbe:
                              tcpSocket:
                                port: 8787
                              initialDelaySeconds: 5
                              periodSeconds: 10
                            resources:
                              requests:
                                cpu: 50m
                                memory: 128Mi
                              limits:
                                cpu: 300m
                                memory: 256Mi
                - apiVersion: networking.k8s.io/v1
                  kind: Ingress
                  metadata:
                    name: mcp-obsidian-ingress
                    namespace: mcp-obsidian
                    annotations:
                      cert-manager.io/cluster-issuer: letsencrypt-prod
                      external-dns.alpha.kubernetes.io/hostname: mcp-obsidian.amer.dev
                      external-dns.alpha.kubernetes.io/ttl: "300"
                  spec:
                    tls:
                      - hosts:
                          - mcp-obsidian.amer.dev
                        secretName: mcp-obsidian-amer-dev-tls
                    rules:
                      - host: mcp-obsidian.amer.dev
                        http:
                          paths:
                            - path: /
                              pathType: Prefix
                              backend:
                                service:
                                  name: obsidian-mcp-server
                                  port:
                                    number: 8787

          # Legacy source: k3s-dean-gitops/apps/bws-mcp/server/. Only changes: secretStoreRef.name
          # fixed to bitwarden-secretsmanager, ESO-defaulted fields declared explicitly (avoids
          # the ArgoCD OutOfSync drift seen on litellm/obsidian-mcp), legacy `property: password`
          # dropped (native BWS provider returns the value directly). No ingress in legacy either
          # - in-cluster only, reached through litellm.
          - name: bws-mcp
            namespace: bws-mcp
            valuesYaml: |
              resources:
                - apiVersion: external-secrets.io/v1
                  kind: ExternalSecret
                  metadata:
                    name: bws-mcp-token
                    namespace: bws-mcp
                  spec:
                    refreshInterval: 1h
                    secretStoreRef:
                      name: bitwarden-secretsmanager
                      kind: ClusterSecretStore
                    target:
                      name: bws-mcp-token
                      creationPolicy: Owner
                      deletionPolicy: Retain
                    data:
                      - secretKey: token
                        remoteRef:
                          key: infra-mcp-bws-token
                          conversionStrategy: Default
                          decodingStrategy: None
                          metadataPolicy: None
                - apiVersion: v1
                  kind: Service
                  metadata:
                    name: bws-mcp-server
                    namespace: bws-mcp
                  spec:
                    selector:
                      app: bws-mcp-server
                    ports:
                      - name: http
                        port: 8000
                        targetPort: 8000
                - apiVersion: apps/v1
                  kind: Deployment
                  metadata:
                    name: bws-mcp-server
                    namespace: bws-mcp
                    annotations:
                      reloader.stakater.com/auto: "true"
                  spec:
                    replicas: 1
                    selector:
                      matchLabels:
                        app: bws-mcp-server
                    strategy:
                      type: RollingUpdate
                      rollingUpdate:
                        maxUnavailable: 0
                        maxSurge: 1
                    template:
                      metadata:
                        labels:
                          app: bws-mcp-server
                      spec:
                        containers:
                          - name: server
                            image: amerenda/bws-mcp:sha-a38bd82
                            imagePullPolicy: Always
                            ports:
                              - containerPort: 8000
                            env:
                              - name: BWS_ACCESS_TOKEN
                                valueFrom:
                                  secretKeyRef:
                                    name: bws-mcp-token
                                    key: token
                              - name: BWS_PROJECT_ID
                                value: "6353f589-39c0-45f2-9e9c-b36f00e0c282"
                            readinessProbe:
                              httpGet:
                                path: /health
                                port: 8000
                              initialDelaySeconds: 5
                              periodSeconds: 10
                            livenessProbe:
                              httpGet:
                                path: /health
                                port: 8000
                              initialDelaySeconds: 10
                              periodSeconds: 30
                            resources:
                              requests:
                                cpu: 50m
                                memory: 64Mi
                              limits:
                                cpu: 200m
                                memory: 128Mi

          # Legacy source: k3s-dean-gitops/apps/infra-mcp/server/. Changes: secretStoreRef.name ->
          # bitwarden-secretsmanager, ESO-defaulted fields explicit, legacy `property: password`
          # dropped, Traefik ingress annotations/ingressClassName dropped, reloader annotation on
          # the pod template kept. RBAC (observer ClusterRole + tofu-state Role) kept verbatim.
          - name: infra-mcp
            namespace: infra-mcp
            valuesYaml: |
              resources:
                - apiVersion: external-secrets.io/v1
                  kind: ExternalSecret
                  metadata:
                    name: infra-mcp-secrets
                    namespace: infra-mcp
                  spec:
                    refreshInterval: 1h
                    secretStoreRef:
                      name: bitwarden-secretsmanager
                      kind: ClusterSecretStore
                    target:
                      name: infra-mcp-secrets
                      creationPolicy: Owner
                      deletionPolicy: Retain
                    data:
                      - secretKey: bws-access-token
                        remoteRef:
                          key: infra-mcp-bws-token
                          conversionStrategy: Default
                          decodingStrategy: None
                          metadataPolicy: None
                      - secretKey: coder-app-id
                        remoteRef:
                          key: github-amerenda-coder-app-id
                          conversionStrategy: Default
                          decodingStrategy: None
                          metadataPolicy: None
                      - secretKey: coder-installation-id
                        remoteRef:
                          key: github-amerenda-coder-installation-id
                          conversionStrategy: Default
                          decodingStrategy: None
                          metadataPolicy: None
                      - secretKey: coder-private-key
                        remoteRef:
                          key: github-amerenda-coder-private-key
                          conversionStrategy: Default
                          decodingStrategy: None
                          metadataPolicy: None
                - apiVersion: v1
                  kind: Service
                  metadata:
                    name: infra-mcp-server
                    namespace: infra-mcp
                  spec:
                    selector:
                      app: infra-mcp-server
                    ports:
                      - name: http
                        port: 8000
                        targetPort: 8000
                - apiVersion: rbac.authorization.k8s.io/v1
                  kind: ClusterRole
                  metadata:
                    name: infra-mcp-observer
                  rules:
                    - apiGroups: ["argoproj.io"]
                      resources: ["applications"]
                      verbs: ["get", "list"]
                    - apiGroups: [""]
                      resources: ["pods"]
                      verbs: ["get", "list"]
                    - apiGroups: ["apps"]
                      resources: ["deployments"]
                      verbs: ["get", "list"]
                - apiVersion: rbac.authorization.k8s.io/v1
                  kind: ClusterRoleBinding
                  metadata:
                    name: infra-mcp-observer
                  subjects:
                    - kind: ServiceAccount
                      name: default
                      namespace: infra-mcp
                  roleRef:
                    kind: ClusterRole
                    name: infra-mcp-observer
                    apiGroup: rbac.authorization.k8s.io
                - apiVersion: rbac.authorization.k8s.io/v1
                  kind: Role
                  metadata:
                    name: tofu-state
                    namespace: infra-mcp
                  rules:
                    - apiGroups: [""]
                      resources: ["secrets"]
                      verbs: ["create", "get", "list", "update", "patch", "delete"]
                    - apiGroups: ["coordination.k8s.io"]
                      resources: ["leases"]
                      verbs: ["create", "get", "list", "update", "patch", "delete"]
                - apiVersion: rbac.authorization.k8s.io/v1
                  kind: RoleBinding
                  metadata:
                    name: tofu-state
                    namespace: infra-mcp
                  subjects:
                    - kind: ServiceAccount
                      name: default
                      namespace: infra-mcp
                  roleRef:
                    kind: Role
                    name: tofu-state
                    apiGroup: rbac.authorization.k8s.io
                - apiVersion: apps/v1
                  kind: Deployment
                  metadata:
                    name: infra-mcp-server
                    namespace: infra-mcp
                  spec:
                    replicas: 1
                    selector:
                      matchLabels:
                        app: infra-mcp-server
                    strategy:
                      type: RollingUpdate
                      rollingUpdate:
                        maxUnavailable: 0
                        maxSurge: 1
                    template:
                      metadata:
                        annotations:
                          reloader.stakater.com/auto: "true"
                        labels:
                          app: infra-mcp-server
                      spec:
                        containers:
                          - name: server
                            image: amerenda/infra-mcp:sha-a38bd82
                            imagePullPolicy: Always
                            ports:
                              - containerPort: 8000
                            env:
                              - name: BWS_ACCESS_TOKEN
                                valueFrom:
                                  secretKeyRef:
                                    name: infra-mcp-secrets
                                    key: bws-access-token
                              - name: CODER_APP_ID
                                valueFrom:
                                  secretKeyRef:
                                    name: infra-mcp-secrets
                                    key: coder-app-id
                              - name: CODER_INSTALLATION_ID
                                valueFrom:
                                  secretKeyRef:
                                    name: infra-mcp-secrets
                                    key: coder-installation-id
                              - name: CODER_APP_PRIVATE_KEY
                                valueFrom:
                                  secretKeyRef:
                                    name: infra-mcp-secrets
                                    key: coder-private-key
                              - name: CLONE_REPOS
                                value: "true"
                            readinessProbe:
                              httpGet:
                                path: /health
                                port: 8000
                              initialDelaySeconds: 5
                              periodSeconds: 10
                            livenessProbe:
                              httpGet:
                                path: /health
                                port: 8000
                              initialDelaySeconds: 10
                              periodSeconds: 30
                            resources:
                              requests:
                                cpu: 100m
                                memory: 256Mi
                              limits:
                                cpu: 500m
                                memory: 512Mi
                - apiVersion: networking.k8s.io/v1
                  kind: Ingress
                  metadata:
                    name: infra-mcp-ingress
                    namespace: infra-mcp
                    annotations:
                      cert-manager.io/cluster-issuer: letsencrypt-prod
                      external-dns.alpha.kubernetes.io/hostname: infra-mcp.amer.dev
                      external-dns.alpha.kubernetes.io/ttl: "300"
                  spec:
                    tls:
                      - hosts:
                          - infra-mcp.amer.dev
                        secretName: infra-mcp-amer-dev-tls
                    rules:
                      - host: infra-mcp.amer.dev
                        http:
                          paths:
                            - path: /
                              pathType: Prefix
                              backend:
                                service:
                                  name: infra-mcp-server
                                  port:
                                    number: 8000

          # Legacy source: k3s-dean-gitops apps/github-mcp/server/externalsecret.yaml (+ siblings). Generated from it with: secretStoreRef.name ->
          # bitwarden-secretsmanager, ESO-defaulted fields explicit, `property: password` dropped,
          # Traefik ingress annotations/ingressClassName dropped, Namespace objects dropped
          # (CreateNamespace=true), reloader annotation added where a Secret/ConfigMap is consumed.
          - name: github-mcp
            namespace: github-mcp
            valuesYaml: |
              resources:
              - apiVersion: external-secrets.io/v1
                kind: ExternalSecret
                metadata:
                  name: github-mcp-secrets
                  namespace: github-mcp
                spec:
                  refreshInterval: 1h
                  secretStoreRef:
                    name: bitwarden-secretsmanager
                    kind: ClusterSecretStore
                  target:
                    name: github-mcp-secrets
                    creationPolicy: Owner
                    deletionPolicy: Retain
                  data:
                  - secretKey: GITHUB_APP_ID
                    remoteRef:
                      key: github-amerenda-coder-app-id
                      conversionStrategy: Default
                      decodingStrategy: None
                      metadataPolicy: None
                  - secretKey: GITHUB_APP_PRIVATE_KEY
                    remoteRef:
                      key: github-amerenda-coder-private-key
                      conversionStrategy: Default
                      decodingStrategy: None
                      metadataPolicy: None
                  - secretKey: GITHUB_APP_INSTALLATION_ID
                    remoteRef:
                      key: github-amerenda-coder-installation-id
                      conversionStrategy: Default
                      decodingStrategy: None
                      metadataPolicy: None
              - apiVersion: v1
                kind: Service
                metadata:
                  name: github-mcp-server
                  namespace: github-mcp
                spec:
                  selector:
                    app: github-mcp-server
                  ports:
                  - name: http
                    port: 8000
                    targetPort: 8000
              - apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: github-mcp-server
                  namespace: github-mcp
                spec:
                  replicas: 1
                  selector:
                    matchLabels:
                      app: github-mcp-server
                  strategy:
                    type: RollingUpdate
                    rollingUpdate:
                      maxUnavailable: 0
                      maxSurge: 1
                  template:
                    metadata:
                      annotations:
                        reloader.stakater.com/auto: 'true'
                      labels:
                        app: github-mcp-server
                    spec:
                      containers:
                      - name: server
                        image: amerenda/github-mcp:sha-a38bd82
                        imagePullPolicy: Always
                        ports:
                        - containerPort: 8000
                        envFrom:
                        - secretRef:
                            name: github-mcp-secrets
                        readinessProbe:
                          httpGet:
                            path: /health
                            port: 8000
                          initialDelaySeconds: 5
                          periodSeconds: 10
                        livenessProbe:
                          httpGet:
                            path: /health
                            port: 8000
                          initialDelaySeconds: 10
                          periodSeconds: 30
                        resources:
                          requests:
                            cpu: 10m
                            memory: 64Mi
                          limits:
                            cpu: 200m
                            memory: 128Mi
              - apiVersion: networking.k8s.io/v1
                kind: Ingress
                metadata:
                  name: github-mcp-ingress
                  namespace: github-mcp
                  annotations:
                    cert-manager.io/cluster-issuer: letsencrypt-prod
                    external-dns.alpha.kubernetes.io/hostname: github-mcp.amer.dev
                    external-dns.alpha.kubernetes.io/ttl: '300'
                spec:
                  tls:
                  - hosts:
                    - github-mcp.amer.dev
                    secretName: github-mcp-amer-dev-tls
                  rules:
                  - host: github-mcp.amer.dev
                    http:
                      paths:
                      - path: /
                        pathType: Prefix
                        backend:
                          service:
                            name: github-mcp-server
                            port:
                              number: 8000

          # Legacy source: k3s-dean-gitops apps/praetor-mcp/server/externalsecret.yaml (+ siblings). Generated from it with: secretStoreRef.name ->
          # bitwarden-secretsmanager, ESO-defaulted fields explicit, `property: password` dropped,
          # Traefik ingress annotations/ingressClassName dropped, Namespace objects dropped
          # (CreateNamespace=true), reloader annotation added where a Secret/ConfigMap is consumed.
          - name: praetor-mcp
            namespace: praetor-mcp
            valuesYaml: |
              resources:
              - apiVersion: external-secrets.io/v1
                kind: ExternalSecret
                metadata:
                  name: praetor-mcp-secrets
                  namespace: praetor-mcp
                spec:
                  refreshInterval: 1h
                  secretStoreRef:
                    name: bitwarden-secretsmanager
                    kind: ClusterSecretStore
                  target:
                    name: praetor-mcp-secrets
                    creationPolicy: Owner
                    deletionPolicy: Retain
                  data:
                  - secretKey: PRAETOR_API_KEY
                    remoteRef:
                      key: praetor-api-key
                      conversionStrategy: Default
                      decodingStrategy: None
                      metadataPolicy: None
              - apiVersion: v1
                kind: Service
                metadata:
                  name: praetor-mcp-server
                  namespace: praetor-mcp
                spec:
                  selector:
                    app: praetor-mcp-server
                  ports:
                  - name: http
                    port: 8000
                    targetPort: 8000
              - apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: praetor-mcp-server
                  namespace: praetor-mcp
                  annotations:
                    reloader.stakater.com/auto: 'true'
                spec:
                  replicas: 1
                  selector:
                    matchLabels:
                      app: praetor-mcp-server
                  strategy:
                    type: RollingUpdate
                    rollingUpdate:
                      maxUnavailable: 0
                      maxSurge: 1
                  template:
                    metadata:
                      labels:
                        app: praetor-mcp-server
                    spec:
                      containers:
                      - name: server
                        image: amerenda/praetor-mcp:sha-8076367
                        imagePullPolicy: Always
                        ports:
                        - containerPort: 8000
                        env:
                        - name: PRAETOR_BASE_URL
                          value: https://praetor.amer.dev
                        - name: PRAETOR_API_KEY
                          valueFrom:
                            secretKeyRef:
                              name: praetor-mcp-secrets
                              key: PRAETOR_API_KEY
                        readinessProbe:
                          httpGet:
                            path: /health
                            port: 8000
                          initialDelaySeconds: 5
                          periodSeconds: 10
                        livenessProbe:
                          httpGet:
                            path: /health
                            port: 8000
                          initialDelaySeconds: 10
                          periodSeconds: 30
                        resources:
                          requests:
                            cpu: 10m
                            memory: 64Mi
                          limits:
                            cpu: 200m
                            memory: 128Mi
              - apiVersion: networking.k8s.io/v1
                kind: Ingress
                metadata:
                  name: praetor-mcp-ingress
                  namespace: praetor-mcp
                  annotations:
                    cert-manager.io/cluster-issuer: letsencrypt-prod
                    external-dns.alpha.kubernetes.io/hostname: praetor-mcp.amer.dev
                    external-dns.alpha.kubernetes.io/ttl: '300'
                spec:
                  tls:
                  - hosts:
                    - praetor-mcp.amer.dev
                    secretName: praetor-mcp-amer-dev-tls
                  rules:
                  - host: praetor-mcp.amer.dev
                    http:
                      paths:
                      - path: /
                        pathType: Prefix
                        backend:
                          service:
                            name: praetor-mcp-server
                            port:
                              number: 8000

          # Next up (background note's proposed order, not Alex-confirmed - reorder freely):
          # bws-mcp, infra-mcp, github-mcp, then kubernetes-mcp / praetor-mcp / grafana-mcp /
          # komodo-mcp / mcp-searxng / secure-search-mcp. Add each as its own list element here,
          # same shape as obsidian-mcp above, once the previous one is verified working.

  template:
    metadata:
      name: "mcp-{{name}}"
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: https://bedag.github.io/helm-charts/
        chart: raw
        targetRevision: 2.0.2
        helm:
          values: "{{valuesYaml}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
