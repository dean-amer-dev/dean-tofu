# Reuses the same ClusterSecretStore the app-of-apps tier's ESO created (bitwarden-secretsmanager,
# cluster-scoped - readable from any namespace). Same eager-create, self-heal pattern as everything
# else: sits Pending until the store is Ready (already true by the time this applies), then syncs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tailscale-auth-key
  namespace: infra
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: tailscale-auth-key
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        authkey: "{{ .authkey }}"
  data:
    - secretKey: authkey
      remoteRef:
        # By UUID - bypasses the store's project scoping. No `property:` (that's for providers
        # with structured sub-fields, e.g. Bitwarden Password Manager login items - BWS secrets
        # are a single opaque string value, confirmed via `bws secret get`; legacy's ExternalSecret
        # set `property: authkey` anyway, which the native bitwardensecretsmanager provider likely
        # just ignores, unlike the working do-dns-api-key ExternalSecret which omits it entirely).
        key: a271a4de-dc5d-416e-aa5c-b36f013feb16
