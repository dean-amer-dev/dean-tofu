# Subnet router (10.100.20.0/24, matching legacy) + exit node, on one Connector - the CRD spec
# explicitly allows exitNode and subnetRouter together on the same instance (only appConnector is
# mutually exclusive with the other two). replicas: 2 gives the same primary/standby HA pattern
# legacy's 2-pod Deployment had, but the operator manages the actual pods/failover itself - no
# hand-rolled Deployment/affinity/DNS-override config needed.
apiVersion: tailscale.com/v1alpha1
kind: Connector
metadata:
  name: gmktec-subnet-router
spec:
  replicas: 2
  subnetRouter:
    advertiseRoutes:
      - "10.100.20.0/24"
  exitNode: true
