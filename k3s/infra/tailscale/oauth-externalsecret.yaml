# The tailscale-operator chart falls back to a pre-existing Secret named exactly "operator-oauth"
# (keys client_id/client_secret) when oauth.clientId/clientSecret are left unset in its values -
# avoids putting the OAuth client secret in plaintext into a Helm values block at all.
#
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: infra
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: operator-oauth
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        client_id: "{{ .client_id }}"
        client_secret: "{{ .client_secret }}"
  data:
    - secretKey: client_id
      remoteRef:
        key: "6706508d-3088-464e-ac03-b4d300ba97d3"
    - secretKey: client_secret
      remoteRef:
        key: "385c7875-6af2-4096-9cea-b4d300babfcd"
