# The tailscale-operator chart falls back to a pre-existing Secret named exactly "operator-oauth"
# (keys client_id/client_secret) when oauth.clientId/clientSecret are left unset in its values -
# avoids putting the OAuth client secret in plaintext into a Helm values block at all.
#
# BWS secret IDs below are PLACEHOLDERS - Alex needs to create an OAuth client in the Tailscale
# admin console (Settings > Keys > OAuth clients), store its client ID and client secret in BWS,
# and give the real UUIDs before this can apply.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: infra
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: operator-oauth
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        client_id: "{{ .client_id }}"
        client_secret: "{{ .client_secret }}"
  data:
    - secretKey: client_id
      remoteRef:
        key: "REPLACE-WITH-BWS-UUID-tailscale-operator-oauth-client-id"
    - secretKey: client_secret
      remoteRef:
        key: "REPLACE-WITH-BWS-UUID-tailscale-operator-oauth-client-secret"
