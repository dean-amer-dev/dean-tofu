apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tdarr
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://bedag.github.io/helm-charts/
    chart: raw
    targetRevision: 2.0.2
    helm:
      values: |
        resources:
        - apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: tdarr-server
            namespace: tdarr
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 5Gi
        - apiVersion: v1
          kind: Service
          metadata:
            name: tdarr-server
            namespace: tdarr
          spec:
            selector:
              app: tdarr-server
            ports:
            - {name: webui, port: 8265, targetPort: 8265}
            - {name: node-comm, port: 8266, targetPort: 8266}
        - apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata:
            name: tdarr-media-amer-dev
            namespace: tdarr
          spec:
            secretName: tdarr-media-amer-dev-tls
            issuerRef:
              name: letsencrypt-prod
              kind: ClusterIssuer
            dnsNames:
            - tdarr.media.amer.dev
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: tdarr-ingress-amer-dev
            namespace: tdarr
            annotations:
              external-dns.alpha.kubernetes.io/hostname: tdarr.media.amer.dev
              external-dns.alpha.kubernetes.io/ttl: "300"
              ingress.cilium.io/loadbalancer-mode: dedicated
              lbipam.cilium.io/sharing-key: external-ingress-private
          spec:
            tls:
            - hosts:
              - tdarr.media.amer.dev
              secretName: tdarr-media-amer-dev-tls
            rules:
            - host: tdarr.media.amer.dev
              http:
                paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: tdarr-server
                      port:
                        number: 8265
        - apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: tdarr-server
            namespace: tdarr
            labels:
              app: tdarr-server
              infra2.amer.dev/single-replica-exempt: "true"
          spec:
            replicas: 1
            strategy:
              type: Recreate
            selector:
              matchLabels:
                app: tdarr-server
            template:
              metadata:
                labels:
                  app: tdarr-server
              spec:
                containers:
                - name: tdarr-server
                  image: ghcr.io/haveagitgat/tdarr:2.82.02
                  env:
                  - {name: TZ, value: America/New_York}
                  - {name: PUID, value: "1000"}
                  - {name: PGID, value: "1000"}
                  - {name: UMASK_SET, value: "002"}
                  - {name: serverIP, value: 0.0.0.0}
                  - {name: serverPort, value: "8266"}
                  - {name: webUIPort, value: "8265"}
                  - {name: internalNode, value: "false"}
                  - {name: inContainer, value: "true"}
                  - {name: ffmpegVersion, value: "7"}
                  - {name: auth, value: "false"}
                  - {name: openBrowser, value: "false"}
                  - {name: maxLogSizeMB, value: "10"}
                  ports:
                  - {name: webui, containerPort: 8265}
                  - {name: node-comm, containerPort: 8266}
                  volumeMounts:
                  - {name: data, mountPath: /app/server, subPath: server}
                  - {name: data, mountPath: /app/configs, subPath: configs}
                  - {name: logs, mountPath: /app/logs}
                  - {name: movies, mountPath: /movies}
                  - {name: tv, mountPath: /tv}
                  - {name: temp, mountPath: /temp}
                  startupProbe:
                    tcpSocket:
                      port: 8265
                    periodSeconds: 10
                    failureThreshold: 30
                  readinessProbe:
                    httpGet:
                      path: /api/v2/status
                      port: 8265
                    periodSeconds: 15
                  livenessProbe:
                    httpGet:
                      path: /api/v2/status
                      port: 8265
                    initialDelaySeconds: 60
                    periodSeconds: 30
                    timeoutSeconds: 10
                    failureThreshold: 3
                  resources:
                    requests:
                      cpu: 100m
                      memory: 512Mi
                    limits:
                      memory: 2Gi
                volumes:
                - name: data
                  persistentVolumeClaim:
                    claimName: tdarr-server
                - name: logs
                  emptyDir:
                    sizeLimit: 1Gi
                - name: temp
                  nfs:
                    server: 10.100.20.19
                    path: /mnt/storage/cache/tdarr
                - name: movies
                  nfs:
                    server: 10.100.20.19
                    path: /mnt/storage/movies
                - name: tv
                  nfs:
                    server: 10.100.20.19
                    path: /mnt/storage/tv
        - apiVersion: apps/v1
          kind: DaemonSet
          metadata:
            name: tdarr-node
            namespace: tdarr
            labels:
              app: tdarr-node
          spec:
            selector:
              matchLabels:
                app: tdarr-node
            template:
              metadata:
                labels:
                  app: tdarr-node
              spec:
                affinity:
                  nodeAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      nodeSelectorTerms:
                      - matchExpressions:
                        - {key: node-role.kubernetes.io/control-plane, operator: DoesNotExist}
                containers:
                - name: tdarr-node
                  image: ghcr.io/haveagitgat/tdarr_node:2.82.02
                  workingDir: /temp
                  env:
                  - {name: TZ, value: America/New_York}
                  - {name: PUID, value: "1000"}
                  - {name: PGID, value: "1000"}
                  - {name: UMASK_SET, value: "002"}
                  - name: nodeName
                    valueFrom:
                      fieldRef:
                        fieldPath: spec.nodeName
                  - {name: serverIP, value: tdarr-server.tdarr.svc.cluster.local}
                  - {name: serverPort, value: "8266"}
                  - {name: inContainer, value: "true"}
                  - {name: ffmpegVersion, value: "7"}
                  - {name: startPaused, value: "false"}
                  - {name: transcodegpuWorkers, value: "0"}
                  - {name: transcodecpuWorkers, value: "1"}
                  - {name: healthcheckgpuWorkers, value: "0"}
                  - {name: healthcheckcpuWorkers, value: "1"}
                  volumeMounts:
                  - {name: movies, mountPath: /movies}
                  - {name: tv, mountPath: /tv}
                  - {name: temp, mountPath: /temp}
                  resources:
                    requests:
                      cpu: 100m
                      memory: 256Mi
                    limits:
                      cpu: "8"
                      memory: 8Gi
                volumes:
                - name: movies
                  nfs:
                    server: 10.100.20.19
                    path: /mnt/storage/movies
                - name: tv
                  nfs:
                    server: 10.100.20.19
                    path: /mnt/storage/tv
                - name: temp
                  nfs:
                    server: 10.100.20.19
                    path: /mnt/storage/cache/tdarr
  destination:
    server: https://kubernetes.default.svc
    namespace: tdarr
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
