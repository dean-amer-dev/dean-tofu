apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: phoenix
  namespace: argocd
spec:
  project: default
  sources:
  - repoURL: registry-1.docker.io/arizephoenix
    chart: phoenix-helm
    targetRevision: 12.0.18
    helm:
      values: |
        postgresql:
          enabled: false
        ingress:
          enabled: false
        service:
          type: ClusterIP
        image:
          tag: version-20.20.0-nonroot
        database:
          postgres:
            host: pg-rw.postgres.svc
            user: phoenix
            db: phoenix
        server:
          enablePrometheus: true
        auth:
          enableAuth: true
          useSecureCookies: true
          createSecret: false
          name: phoenix-auth
          csrfTrustedOrigins:
          - https://phoenix.amer.dev
          secret:
          - key: PHOENIX_SECRET
            valueFrom:
              secretKeyRef: {name: phoenix-auth, key: PHOENIX_SECRET}
          - key: PHOENIX_ADMIN_SECRET
            valueFrom:
              secretKeyRef: {name: phoenix-auth, key: PHOENIX_ADMIN_SECRET}
          - key: PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD
            valueFrom:
              secretKeyRef: {name: phoenix-auth, key: PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD}
          - key: PHOENIX_POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef: {name: phoenix-postgres, key: password}
  - repoURL: https://bedag.github.io/helm-charts/
    chart: raw
    targetRevision: 2.0.2
    helm:
      values: |
        resources:
        - apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: phoenix-auth
            namespace: phoenix
          spec:
            refreshInterval: 1h
            secretStoreRef:
              name: bitwarden-secretsmanager
              kind: ClusterSecretStore
            target:
              name: phoenix-auth
              creationPolicy: Owner
              deletionPolicy: Retain
            data:
            - secretKey: PHOENIX_SECRET
              remoteRef:
                key: phoenix-secret-key
                conversionStrategy: Default
                decodingStrategy: None
                metadataPolicy: None
            - secretKey: PHOENIX_ADMIN_SECRET
              remoteRef:
                key: phoenix-admin-secret
                conversionStrategy: Default
                decodingStrategy: None
                metadataPolicy: None
            - secretKey: PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD
              remoteRef:
                key: phoenix-admin-password
                conversionStrategy: Default
                decodingStrategy: None
                metadataPolicy: None
        - apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata:
            name: phoenix-amer-dev
            namespace: phoenix
          spec:
            secretName: phoenix-amer-dev-tls
            issuerRef:
              name: letsencrypt-prod
              kind: ClusterIssuer
            dnsNames:
            - phoenix.amer.dev
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: phoenix-ingress
            namespace: phoenix
            annotations:
              external-dns.alpha.kubernetes.io/hostname: phoenix.amer.dev
              external-dns.alpha.kubernetes.io/ttl: "300"
          spec:
            ingressClassName: cilium
            tls:
            - hosts:
              - phoenix.amer.dev
              secretName: phoenix-amer-dev-tls
            rules:
            - host: phoenix.amer.dev
              http:
                paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: phoenix-svc
                      port:
                        number: 6006
  destination:
    server: https://kubernetes.default.svc
    namespace: phoenix
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
