apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mem0
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://bedag.github.io/helm-charts/
    chart: raw
    targetRevision: 2.0.2
    helm:
      values: |
        resources:
        - apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: mem0-auth
            namespace: mem0
          spec:
            refreshInterval: 1h
            secretStoreRef:
              name: bitwarden-secretsmanager
              kind: ClusterSecretStore
            target:
              name: mem0-auth
              creationPolicy: Owner
              deletionPolicy: Retain
            data:
            - secretKey: ADMIN_API_KEY
              remoteRef:
                key: mem0-admin-api-key
                conversionStrategy: Default
                decodingStrategy: None
                metadataPolicy: None
            - secretKey: JWT_SECRET
              remoteRef:
                key: mem0-jwt-secret
                conversionStrategy: Default
                decodingStrategy: None
                metadataPolicy: None
            - secretKey: OPENAI_API_KEY
              remoteRef:
                key: litellm-master-key
                conversionStrategy: Default
                decodingStrategy: None
                metadataPolicy: None
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: mem0-config
            namespace: mem0
          data:
            POSTGRES_HOST: pg-rw.postgres.svc
            POSTGRES_PORT: "5432"
            POSTGRES_DB: mem0
            POSTGRES_USER: mem0
            APP_DB_NAME: mem0
            OPENAI_BASE_URL: http://litellm-server.litellm.svc:4000/v1
            MEM0_DEFAULT_LLM_MODEL: coder
            MEM0_DEFAULT_EMBEDDER_MODEL: nomic-embed-text
            EMBEDDING_MODEL_DIMS: "768"
            HISTORY_DB_PATH: ":memory:"
            MEM0_TELEMETRY: "false"
            DASHBOARD_URL: https://mem0.amer.dev
        - apiVersion: v1
          kind: Service
          metadata:
            name: mem0-server
            namespace: mem0
          spec:
            selector:
              app: mem0-server
            ports:
            - name: http
              port: 8000
              targetPort: 8000
        - apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: mem0-server
            namespace: mem0
            annotations:
              reloader.stakater.com/auto: "true"
          spec:
            replicas: 2
            selector:
              matchLabels:
                app: mem0-server
            strategy:
              type: RollingUpdate
              rollingUpdate:
                maxUnavailable: 0
                maxSurge: 1
            template:
              metadata:
                labels:
                  app: mem0-server
              spec:
                nodeSelector:
                  node-role.kubernetes.io/control-plane: "true"
                affinity:
                  podAntiAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                    - labelSelector:
                        matchLabels:
                          app: mem0-server
                      topologyKey: kubernetes.io/hostname
                initContainers:
                - name: migrate
                  image: amerenda/mem0-server@sha256:3cbf0ea39ebab13d7dacb9e12105795cfa9eb00ea256f1c43be416cc110e3209
                  imagePullPolicy: IfNotPresent
                  workingDir: /app
                  command: ["alembic", "upgrade", "head"]
                  envFrom:
                  - configMapRef:
                      name: mem0-config
                  env:
                  - name: POSTGRES_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: mem0-postgres
                        key: password
                  resources:
                    requests:
                      cpu: 50m
                      memory: 128Mi
                    limits:
                      memory: 256Mi
                - name: seed-config
                  image: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
                  env:
                  - name: DBURI
                    valueFrom:
                      secretKeyRef: {name: mem0-postgres, key: uri}
                  command: ["/bin/bash", "-euo", "pipefail", "-c"]
                  args:
                  - |
                    t=$(psql "$DBURI" -Atc "select format_type(atttypid, atttypmod) from pg_attribute where attrelid = to_regclass('public.memories') and attname = 'vector'")
                    if [ -n "$t" ] && [ "$t" != "vector(768)" ]; then
                      n=$(psql "$DBURI" -Atc "select count(*) from public.memories")
                      [ "$n" = "0" ] || { echo "REFUSING to touch memories: $t with $n rows" >&2; exit 1; }
                      psql "$DBURI" -c "drop table if exists public.memories"
                      echo "dropped empty memories table of type $t"
                    fi
                    psql "$DBURI" -c "insert into settings (key, value, updated_at) values ('config_overrides', '{\"vector_store\": {\"config\": {\"embedding_model_dims\": 768}}}', now()) on conflict (key) do nothing"
                    echo "SEED_OK"
                  resources:
                    requests: {cpu: 20m, memory: 32Mi}
                    limits: {memory: 128Mi}
                containers:
                - name: server
                  image: amerenda/mem0-server@sha256:3cbf0ea39ebab13d7dacb9e12105795cfa9eb00ea256f1c43be416cc110e3209
                  imagePullPolicy: IfNotPresent
                  ports:
                  - containerPort: 8000
                  envFrom:
                  - configMapRef:
                      name: mem0-config
                  - secretRef:
                      name: mem0-auth
                  env:
                  - name: POSTGRES_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: mem0-postgres
                        key: password
                  startupProbe:
                    httpGet:
                      path: /openapi.json
                      port: 8000
                    periodSeconds: 5
                    failureThreshold: 36
                  readinessProbe:
                    httpGet:
                      path: /openapi.json
                      port: 8000
                    periodSeconds: 10
                  livenessProbe:
                    httpGet:
                      path: /openapi.json
                      port: 8000
                    periodSeconds: 30
                    timeoutSeconds: 5
                  resources:
                    requests:
                      cpu: 100m
                      memory: 512Mi
                    limits:
                      memory: 512Mi
        - apiVersion: policy/v1
          kind: PodDisruptionBudget
          metadata:
            name: mem0-server
            namespace: mem0
          spec:
            maxUnavailable: 1
            selector:
              matchLabels:
                app: mem0-server
        - apiVersion: cilium.io/v2
          kind: CiliumNetworkPolicy
          metadata:
            name: mem0-server
            namespace: mem0
          spec:
            endpointSelector:
              matchLabels:
                app: mem0-server
            ingress:
            - fromEntities:
              - ingress
              toPorts:
              - ports:
                - {port: "8000", protocol: TCP}
            - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: mcp
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: litellm
              toPorts:
              - ports:
                - {port: "8000", protocol: TCP}
        - apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata:
            name: mem0-amer-dev
            namespace: mem0
          spec:
            secretName: mem0-amer-dev-tls
            issuerRef:
              name: letsencrypt-prod
              kind: ClusterIssuer
            dnsNames:
            - mem0.amer.dev
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: mem0-ingress
            namespace: mem0
            annotations:
              external-dns.alpha.kubernetes.io/hostname: mem0.amer.dev
              external-dns.alpha.kubernetes.io/ttl: "300"
          spec:
            ingressClassName: cilium
            tls:
            - hosts:
              - mem0.amer.dev
              secretName: mem0-amer-dev-tls
            rules:
            - host: mem0.amer.dev
              http:
                paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: mem0-server
                      port:
                        number: 8000
        - apiVersion: batch/v1
          kind: Job
          metadata:
            name: mem0-verify-dims
            namespace: mem0
            annotations:
              argocd.argoproj.io/hook: PostSync
              argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
          spec:
            backoffLimit: 4
            template:
              spec:
                restartPolicy: OnFailure
                containers:
                - name: psql
                  image: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
                  env:
                  - name: DBURI
                    valueFrom:
                      secretKeyRef: {name: mem0-postgres, key: uri}
                  command: ["/bin/bash", "-euo", "pipefail", "-c"]
                  args:
                  - |
                    psql "$DBURI" -Atc "select tablename from pg_tables where schemaname = 'public' order by 1" | sed 's/^/table: /'
                    t=$(psql "$DBURI" -Atc "select format_type(atttypid, atttypmod) from pg_attribute where attrelid = to_regclass('public.memories') and attname = 'vector'")
                    if [ -z "$t" ]; then
                      echo "DIMS_PENDING memories table is created on first use, nothing to check yet"
                    elif [ "$t" = "vector(768)" ]; then
                      echo "DIMS_OK $t"
                    else
                      echo "DIMS_WRONG expected vector(768), got $t (not failing the sync; the seed-config init container repairs an empty table on the next pod start)"
                    fi
                  resources:
                    requests: {cpu: 20m, memory: 32Mi}
                    limits: {memory: 128Mi}
  destination:
    server: https://kubernetes.default.svc
    namespace: mem0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 5m
