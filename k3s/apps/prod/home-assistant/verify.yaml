apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: home-assistant-verify
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://bedag.github.io/helm-charts/
    chart: raw
    targetRevision: 2.0.2
    helm:
      values: |
        resources:
        - apiVersion: batch/v1
          kind: Job
          metadata:
            name: ha-recorder-verify
            namespace: home-assistant
          spec:
            ttlSecondsAfterFinished: 86400
            backoffLimit: 2
            template:
              spec:
                restartPolicy: Never
                containers:
                - name: psql
                  image: postgres:18
                  env:
                  - name: URI
                    valueFrom:
                      secretKeyRef:
                        name: home-assistant-postgres
                        key: uri
                  resources:
                    requests:
                      cpu: 50m
                      memory: 64Mi
                    limits:
                      memory: 128Mi
                  command: ["/bin/sh", "-c"]
                  args:
                  - |
                    for i in $(seq 1 60); do
                      n=$(psql "$URI" -Atc "select count(*) from information_schema.tables where table_schema='public' and table_name in ('states','states_meta','statistics','statistics_meta','schema_changes')" 2>/dev/null)
                      [ "$n" = "5" ] && break
                      echo "waiting for HA recorder schema ($i)"; sleep 20
                    done
                    psql "$URI" -c "select count(*) as public_tables from information_schema.tables where table_schema='public'"
                    psql "$URI" -c "select table_name from information_schema.tables where table_schema='public' and table_name in ('states','states_meta','statistics','statistics_meta','schema_changes') order by 1"
                    [ "$n" = "5" ]
  destination:
    server: https://kubernetes.default.svc
    namespace: home-assistant
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
