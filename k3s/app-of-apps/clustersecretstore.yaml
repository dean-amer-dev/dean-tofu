# Created eagerly, no wait - sits not-Ready until bitwarden-sdk-server-tls's Secret exists and ESO's
# CRDs are registered, then self-heals (ESO reconciles ClusterSecretStore on a timer regardless).
# caProvider (not caBundle): ESO reads the CA from the Secret at runtime, so this never needs a
# Tofu-side data-source read of a value that doesn't exist until cert-manager actually issues it.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: bitwarden-secretsmanager
spec:
  provider:
    bitwardensecretsmanager:
      apiURL: https://api.bitwarden.com
      identityURL: https://identity.bitwarden.com
      bitwardenServerSDKURL: https://bitwarden-sdk-server.app-of-apps.svc.cluster.local:9998
      auth:
        secretRef:
          credentials:
            name: bitwarden-credentials
            namespace: app-of-apps
            key: access-token
      caProvider:
        type: Secret
        name: bitwarden-tls-certs
        namespace: app-of-apps
        key: ca.crt
      # Required by the CRD schema ("1 store == 1 organization/project"), but every ExternalSecret
      # here references BWS secrets by UUID, which bypasses project-scoped name lookup entirely
      # (confirmed via ESO's own docs) - so this is a required-but-effectively-unused field, not a
      # real constraint on which secrets are reachable.
      organizationID: a9b83b36-d37e-4532-88a4-b36f00df7f3d
      projectID: 6353f589-39c0-45f2-9e9c-b36f00e0c282
