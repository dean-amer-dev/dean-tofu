apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: app-of-apps
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: cert-manager
            namespace: app-of-apps
            repoURL: https://charts.jetstack.io
            chart: cert-manager
            targetRevision: v1.21.2
            syncWave: "0"
            valuesYaml: |
              installCRDs: true
              image:
                repository: quay.io/jetstack/cert-manager-controller
                tag: v1.21.2
              webhook:
                image:
                  repository: quay.io/jetstack/cert-manager-webhook
                  tag: v1.21.2
                hostNetwork: false
              cainjector:
                image:
                  repository: quay.io/jetstack/cert-manager-cainjector
                  tag: v1.21.2
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                fsGroup: 1000
              resources:
                limits:
                  cpu: 100m
                  memory: 128Mi
                requests:
                  cpu: 100m
                  memory: 128Mi
              extraArgs:
                - --enable-certificate-owner-ref=true
                - --max-concurrent-challenges=1
                - --dns01-recursive-nameservers=8.8.8.8:53,1.1.1.1:53
                - --dns01-recursive-nameservers-only
              prometheus:
                enabled: true
                servicemonitor:
                  enabled: false

          - name: eso
            namespace: app-of-apps
            repoURL: https://charts.external-secrets.io
            chart: external-secrets
            targetRevision: 0.20.2
            syncWave: "1"
            valuesYaml: |
              installCRDs: true
              deploymentAnnotations:
                reloader.stakater.com/search: "true"
              # No webhook.tls/certManager block: verified via `helm show values` against the
              # real v0.20.2 chart that no such field exists - the webhook manages its own TLS
              # cert internally (eso-external-secrets-cert-controller), already working with
              # chart defaults. Legacy's values.yaml assumed an older chart schema.
              bitwarden-sdk-server:
                enabled: true
                podAnnotations:
                  secret.reloader.stakater.com/reload: "bitwarden-tls-certs"
                # image.tls.enabled defaults to true already (see values schema) - the subchart
                # expects a pre-existing bitwarden-tls-certs Secret, it does not create one via
                # any certManager values field (also verified - no such field exists here
                # either). See bitwarden-sdk-server-tls.yaml, applied directly by Tofu.
                resources:
                  requests:
                    cpu: 50m
                    memory: 128Mi
                  limits:
                    memory: 512Mi

          - name: reloader
            namespace: app-of-apps
            repoURL: https://stakater.github.io/stakater-charts
            chart: reloader
            targetRevision: 2.2.17
            syncWave: "3"
            valuesYaml: |
              reloader:
                watchGlobally: true

          - name: external-dns-do
            namespace: app-of-apps
            # Bitnami's chart was tried next (still lists digitalocean as a supported provider)
            # but its free-tier OCI registry now returns 401 Unauthorized even for pulls that
            # succeed interactively via `helm pull` - confirmed live, ArgoCD's repo-server can't
            # auth to it. Reverted rather than add a Docker Hub credential dependency just for a
            # chart frozen since 2025-08-13.
            #
            # Real fix: kubernetes-sigs removed DigitalOcean in PR #6283 (merged 2026-03-17,
            # "chore(digitalocean)!: remove in-tree provider") - chart 1.20.0 (app v0.20.0,
            # released 2026-01-02) is the last release published *before* that merge. Confirmed
            # directly (not inferred from dates alone): provider/digitalocean/digital_ocean.go
            # exists in the source tree at tag v0.20.0, and it reads the token from the DO_TOKEN
            # env var - exactly matching k3s-dean-gitops's values.yaml shape (provider.name:
            # digitalocean + a flat env: override), which is why that shape looked right from the
            # start - it just needs a chart old enough to still have the provider. Same repo used
            # for every other component here, no OCI/auth involved.
            repoURL: https://kubernetes-sigs.github.io/external-dns/
            chart: external-dns
            targetRevision: "1.20.0"
            syncWave: "4"
            valuesYaml: |
              provider:
                name: digitalocean
              env:
                - name: DO_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: do-dns-api-key
                      key: digitalocean_api_token
              domainFilters:
                - amer.dev
              sources:
                - ingress
                - service
                - crd
              policy: sync
              interval: 5m
              txtOwnerId: "external-dns-do"
              txtPrefix: "do-"
              logLevel: info

          - name: openebs
            namespace: openebs
            repoURL: https://openebs.github.io/lvm-localpv
            chart: lvm-localpv
            targetRevision: 1.10.1
            syncWave: "5"
            valuesYaml: |
              lvmPlugin:
                image:
                  pullPolicy: IfNotPresent
              analytics:
                enabled: false

  template:
    metadata:
      name: "{{name}}"
      annotations:
        argocd.argoproj.io/sync-wave: "{{syncWave}}"
    spec:
      project: default
      source:
        repoURL: "{{repoURL}}"
        chart: "{{chart}}"
        targetRevision: "{{targetRevision}}"
        helm:
          values: "{{valuesYaml}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          # ESO's ClusterSecretStore/SecretStore CRDs are large enough (many provider schemas)
          # that the client-side apply's kubectl.kubernetes.io/last-applied-configuration
          # annotation exceeds Kubernetes' 262144-byte annotation limit. Server-side apply
          # doesn't use that annotation at all, avoiding the size limit. Applied cluster-wide
          # here (safe for every component, not just ESO).
          - ServerSideApply=true
