apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: app-of-apps
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: cert-manager
            namespace: app-of-apps
            repoURL: https://charts.jetstack.io
            chart: cert-manager
            targetRevision: v1.21.2
            syncWave: "0"
            valuesYaml: |
              installCRDs: true
              image:
                repository: quay.io/jetstack/cert-manager-controller
                tag: v1.21.2
              webhook:
                image:
                  repository: quay.io/jetstack/cert-manager-webhook
                  tag: v1.21.2
                hostNetwork: false
              cainjector:
                image:
                  repository: quay.io/jetstack/cert-manager-cainjector
                  tag: v1.21.2
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                fsGroup: 1000
              resources:
                limits:
                  cpu: 100m
                  memory: 128Mi
                requests:
                  cpu: 100m
                  memory: 128Mi
              extraArgs:
                - --enable-certificate-owner-ref=true
                - --max-concurrent-challenges=1
                - --dns01-recursive-nameservers=8.8.8.8:53,1.1.1.1:53
                - --dns01-recursive-nameservers-only
              prometheus:
                enabled: true
                servicemonitor:
                  enabled: false

          - name: eso
            namespace: app-of-apps
            repoURL: https://charts.external-secrets.io
            chart: external-secrets
            targetRevision: 0.20.2
            syncWave: "1"
            valuesYaml: |
              installCRDs: true
              deploymentAnnotations:
                reloader.stakater.com/search: "true"
              webhook:
                enabled: true
                port: 9443
                tls:
                  enabled: true
                  certManager:
                    enabled: true
                    issuerRef:
                      name: selfsigned-issuer
                      kind: ClusterIssuer
                    certificate:
                      name: external-secrets-webhook-cert
                      namespace: app-of-apps
              bitwarden-sdk-server:
                enabled: true
                podAnnotations:
                  secret.reloader.stakater.com/reload: "bitwarden-tls-certs"
                tls:
                  enabled: true
                  certManager:
                    enabled: true
                    issuerRef:
                      name: selfsigned-issuer
                      kind: ClusterIssuer
                    certificate:
                      name: bitwarden-sdk-server-tls
                      namespace: app-of-apps
                resources:
                  requests:
                    cpu: 50m
                    memory: 128Mi
                  limits:
                    memory: 512Mi

          - name: reloader
            namespace: app-of-apps
            repoURL: https://stakater.github.io/stakater-charts
            chart: reloader
            targetRevision: 2.2.17
            syncWave: "3"
            valuesYaml: |
              reloader:
                watchGlobally: true

          - name: external-dns-do
            namespace: app-of-apps
            repoURL: oci://registry.k8s.io/external-dns/charts/external-dns
            chart: external-dns
            targetRevision: 1.22.0
            syncWave: "4"
            valuesYaml: |
              provider:
                name: digitalocean
              env:
                - name: DO_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: do-dns-api-key
                      key: api-key
              domainFilters:
                - amer.dev
              sources:
                - ingress
                - service
                - crd
              policy: sync
              interval: 5m
              minEventSyncInterval: 5m
              txtOwnerId: "external-dns-do"
              txtPrefix: "do-"
              logLevel: info
              logFormat: text

          - name: openebs
            namespace: openebs
            repoURL: https://openebs.github.io/lvm-localpv
            chart: lvm-localpv
            targetRevision: 1.10.1
            syncWave: "5"
            valuesYaml: |
              lvmPlugin:
                image:
                  pullPolicy: IfNotPresent
              analytics:
                enabled: false

  template:
    metadata:
      name: "{{name}}"
      annotations:
        argocd.argoproj.io/sync-wave: "{{syncWave}}"
    spec:
      project: default
      source:
        repoURL: "{{repoURL}}"
        chart: "{{chart}}"
        targetRevision: "{{targetRevision}}"
        helm:
          values: "{{valuesYaml}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
