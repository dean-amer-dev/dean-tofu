# Created eagerly - sits Pending until the ClusterSecretStore above is Ready, then self-heals.
# Referenced by external-dns-do (already deployed) and the ACME ClusterIssuer below.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: do-dns-api-key
  namespace: app-of-apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: do-dns-api-key
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        api-key: "{{ .do_dns_api_key }}"
  data:
    - secretKey: do_dns_api_key
      # By UUID, not name - bypasses the store's project scoping (do-dns-api-key lives in the "k3s"
      # BWS project, same one set as projectID above, but UUID lookup works regardless of project).
      remoteRef:
        key: d043a77f-ca1e-4ac6-8cfa-b38200f7b6c9
