# letsencrypt-PROD - cut over 2026-09-28 after letsencrypt-staging certs were manually verified
# Ready across all 9 k3s/infra/external-ingress/ ingresses (see acme-clusterissuer.yaml's comment
# for the original staging-until-confirmed policy this fulfills).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: alex@amer.dev
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - dns01:
          digitalocean:
            tokenSecretRef:
              name: do-dns-api-key
              key: digitalocean_api_token
